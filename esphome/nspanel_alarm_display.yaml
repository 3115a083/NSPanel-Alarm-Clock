# Local display owner for the EU standalone profile; no Easy lifecycle.
esphome:
  includes: [alarm_ui.h, alarm_display_state.h]
display:
  - platform: nextion
    id: disp1
    uart_id: tf_uart
    update_interval: never
    exit_reparse_on_start: true
    tft_url: ${alarm_tft_url}
    on_setup:
      - lambda: |-
          wake_alarm::display_state().setup();
          wake_alarm::clock_renderer().reset();
    on_page:
      - lambda: |-
          wake_alarm::display_state().page();
          wake_alarm::clock_renderer().reset();
    on_custom_binary_sensor:
      - lambda: |-
          if (key == "wa_clock_v2" && value) {
            wake_alarm::display_state().announce();
            id(disp1).send_command("sendxy=1");
            wake_alarm::panel_controls().wake(millis());
            wake_alarm::clock_renderer().reset();
            ESP_LOGI("wake_alarm.ui", "Standalone clock HMI protocol v2 ready");
          }
number:
  - platform: template
    id: wa_idle_brightness
    name: Alarm Clock Idle Brightness
    entity_category: config
    min_value: 1
    max_value: 100
    step: 1
    initial_value: 25
    restore_value: true
    optimistic: true
    update_interval: never
text_sensor:
  - platform: template
    name: Alarm Clock Display Status
    entity_category: diagnostic
    update_interval: 5s
    lambda: 'return {wake_alarm::display_state().status(id(disp1).is_setup())};'
button:
  - platform: template
    name: Alarm Clock Retry Display
    entity_category: diagnostic
    on_press:
      - lambda: 'wake_alarm::display_state().setup();'
  - platform: template
    name: Alarm Clock Upload TFT
    entity_category: config
    on_press:
      - lambda: |-
          if (id(wa_unacknowledged) || wake_alarm::display_state().busy) {
            ESP_LOGW("wake_alarm.ui", "TFT upload refused during pending alarm or update");
            return;
          }
          wake_alarm::display_state().busy = true;
          const bool result = id(disp1).upload_tft();
          wake_alarm::display_state().busy = false;
          wake_alarm::display_state().setup();
          ESP_LOGI("wake_alarm.ui", "TFT upload finished: %s", result ? "success" : "failed");
interval:
  - interval: 1s
    then:
      - lambda: |-
          auto &state = wake_alarm::display_state();
          if (state.busy || !id(disp1).is_setup()) return;
          if (state.route(millis(), true)) {
            // Only a known page name, no wa_ writes until its v2 announcement.
            id(disp1).send_command("page home_smpl");
            return;
          }
          if (!state.ready || id(disp1).queue_size() > 8) return;
          auto &ui = wake_alarm::panel_controls();
          ui.twelve = id(wa_twelve_hour);
          ui.night_schedule.enabled = id(wa_schedule_enabled);
          ui.night_schedule.start = id(wa_schedule_start);
          ui.night_schedule.end = id(wa_schedule_end);
          ui.night_schedule.blackout = id(wa_blackout_enabled);
          ui.night_schedule.black_start = id(wa_blackout_start);
          ui.night_schedule.black_end = id(wa_blackout_end);
          ui.night_schedule.requires_light = id(wa_blackout_light);
          ui.timeout_s = id(wa_night_timeout);
          ui.night_brightness = id(wa_night_brightness);
          ui.prewake_minutes = id(wa_prewake_minutes);
          ui.agenda_after_stop_s = id(wa_agenda_seconds);
          const auto now = id(time_provider).now();
          const bool valid = now.is_valid() && now.timestamp > 1735689600;
          ui.night_mode = ui.night_schedule.mode(id(wa_night_mode), now.hour * 60 + now.minute, valid,
              ui.light_off, ui.light_valid && uint32_t(millis() - ui.light_ms) <= 600000);
          const auto next = valid && id(wa_enabled) ? wake_alarm::next_alarm(now.timestamp,
              id(wa_hour), id(wa_minute), id(wa_weekmask), id(wa_last_fired_ymd),
              {{{id(wa_plan_date0), id(wa_plan_epoch0), id(wa_plan_source0)},
                {id(wa_plan_date1), id(wa_plan_epoch1), id(wa_plan_source1)}}}) : wake_alarm::DayPlan{};
          const bool prewake = valid && id(wa_enabled) && next.epoch > now.timestamp && ui.prewake_minutes > 0 &&
              next.epoch - now.timestamp <= ui.prewake_minutes * 60;
          ui.tick(millis(), id(wa_ringing), prewake);
          const int brightness = id(wa_ringing) ? 100 : ui.dark ?
              (ui.night_mode == 2 ? 0 : ui.night_brightness) : (int)id(wa_idle_brightness).state;
          if (brightness != state.brightness) {
            id(disp1).set_backlight_brightness(brightness / 100.0f);
            state.brightness = brightness;
          }
          const auto page = ui.dark ? wake_alarm::PanelPage::CLOCK : ui.page;
          const bool clock_page = page == wake_alarm::PanelPage::CLOCK;
          static int previous_style = -1;
          const int style = int(page) + (ui.dark ? 16 : 0) + (ui.twelve ? 32 : 0) + (id(wa_ringing) ? 64 : 0);
          if (style != previous_style || wake_alarm::clock_renderer().fresh) {
            static const char *titles[] = {"ALARM CLOCK", "SET ALARM", "WEATHER", "ENTITIES", "THERMOSTAT", "HUMIDIFIER", "CALENDAR"};
            id(disp1).set_component_text("wa_title", id(wa_ringing) ? "ALARM" : titles[int(page)]);
            id(disp1).set_component_font("wa_state", 1);
            id(disp1).send_command_printf("wa_state.pco=%d", id(wa_ringing) ? 63488 : 65535);
            id(disp1).set_component_font("wa_enabled", 1);
            id(disp1).set_component_font("wa_date", 1);
            id(disp1).set_component_font("wa_time", clock_page || page == wake_alarm::PanelPage::ALARM ? 6 : 2);
            id(disp1).set_component_font("wa_alarm", clock_page ? 5 : 1);
            for (const auto *name : {"wa_title", "wa_state", "wa_date", "wa_enabled", "wa_days"})
              id(disp1).send_command_printf("vis %s,%d", name,
                  !ui.dark || (ui.twelve && std::string(name) == "wa_date") ? 1 : 0);
            id(disp1).send_command_printf("wa_time.pco=%d", ui.dark ? 16904 : 65535);
            id(disp1).send_command_printf("wa_alarm.pco=%d", ui.dark ? 16904 : 65535);
            id(disp1).send_command_printf("wa_date.pco=%d", ui.dark ? 16904 : 52857);
            id(disp1).send_command("fill 20,282,440,26,0");
            wake_alarm::clock_renderer().reset(); previous_style = style;
          }
          auto view = wake_alarm::clock_view(valid, now.hour, now.minute, now.year, now.month,
              now.day_of_month, id(wa_enabled), id(wa_hour), id(wa_minute), id(wa_weekmask),
              id(wa_ringing), id(wa_unacknowledged));
          if (valid) {
            view.text[1] = wake_alarm::clock_digits(now.hour, now.minute, ui.twelve);
            if (ui.twelve) view.text[2] = std::string(now.hour < 12 ? "AM  " : "PM  ") + view.text[2];
            if (ui.dark && ui.twelve) view.text[2] = now.hour < 12 ? "AM" : "PM";
          }
          view.text[3] = "NEXT ALARM"; view.text[4] = "--:--";
          if (valid && id(wa_enabled) && next.epoch > 0) {
            if (!id(wa_unacknowledged)) view.text[0] = "Armed";
            const time_t epoch = next.epoch;
            std::tm local{}; localtime_r(&epoch, &local);
            view.text[4] = wake_alarm::clock_digits(local.tm_hour, local.tm_min, ui.twelve);
            view.text[3] = next.source == 1 ? "APP ALARM" : next.source == 2 ? "CALENDAR ALARM" : "NEXT ALARM";
            if (ui.twelve) view.text[3] += local.tm_hour < 12 ? " AM" : " PM";
          }
          if (id(wa_ringing)) view.text[2] = "Tap Snooze or Stop below";
          if (id(wa_unacknowledged) && !id(wa_ringing)) {
            view.text[3] = "SNOOZE LEFT";
            view.text[4] = valid ? wake_alarm::remaining_seconds(id(wa_snooze_epoch), now.timestamp) : "--:--";
          }
          std::string footer = "Set alarm";
          if (page == wake_alarm::PanelPage::ALARM) {
            if (!ui.editing) ui.begin_edit(id(wa_hour), id(wa_minute), id(wa_enabled));
            const auto weekdays = view.text[6];
            view.text = {"Draft", wake_alarm::clock_digits(ui.draft_hour, ui.draft_minute, ui.twelve),
                "Tap time: choose hour/minute", ui.edit_minute ? "Editing MINUTE" : "Editing HOUR", "",
                ui.draft_enabled ? "On (tap)" : "Off (tap)", ""};
            view.text[4] = weekdays.substr(0,24);
            if (ui.twelve) view.text[2] = std::string(ui.draft_hour < 12 ? "AM - " : "PM - ") + view.text[2];
            footer = "Save";
          } else if (!clock_page) {
            const bool stale = !ui.cards_ms || uint32_t(millis() - ui.cards_ms) > 600000 ||
                (page == wake_alarm::PanelPage::AGENDA && ui.agenda_error);
            view.text = {stale ? "Stale" : "Ready", "", "", "", "", "", ""};
            const auto card = [&](int index) { return ui.cards[index].empty() ? std::string("Unavailable") : ui.cards[index]; };
            if (page == wake_alarm::PanelPage::WEATHER) { view.text[1] = card(0); view.text[2] = card(1); }
            if (page == wake_alarm::PanelPage::ENTITIES) {
              view.text[1] = card(2); view.text[2] = card(3);
              view.text[4] = card(4).substr(0,24); view.text[5] = card(5).substr(0,20);
            }
            if (page == wake_alarm::PanelPage::CLIMATE) { view.text[1] = card(6); view.text[2] = card(7); }
            if (page == wake_alarm::PanelPage::HUMIDIFIER) { view.text[1] = card(8); view.text[2] = card(9); }
            if (page == wake_alarm::PanelPage::AGENDA) { view.text[1] = card(10); view.text[2] = card(11); }
            footer = page == wake_alarm::PanelPage::CLIMATE || page == wake_alarm::PanelPage::HUMIDIFIER ? "Toggle / body - +" : "Swipe or hold keys";
          }
          if (!ui.notice.empty()) { view.text[0] = "Info"; view.text[2] = ui.notice; }
          if (id(wa_unacknowledged)) footer = id(wa_ringing) ? "Snooze / Stop" : "Cancel snooze";
          view.text[6] = "";  // Footer drawn at explicit hit-target coordinates.
          const bool fresh = wake_alarm::clock_renderer().fresh;
          wake_alarm::clock_renderer().render(view, [](const char *name, const std::string &text) {
            id(disp1).set_component_text(name, wake_alarm::safe_text(text).c_str());
          });
          static std::string previous_footer;
          if (!ui.dark && (fresh || footer != previous_footer)) {
            const char *left = page == wake_alarm::PanelPage::ALARM ? "-" : "<";
            const char *right = page == wake_alarm::PanelPage::ALARM ? "+" : ">";
            id(disp1).send_command_printf("xstr 20,282,70,26,1,52857,0,1,1,1,\"%s\"", left);
            id(disp1).send_command_printf("xstr 100,282,280,26,1,52857,0,1,1,1,\"%s\"", footer.c_str());
            id(disp1).send_command_printf("xstr 390,282,70,26,1,52857,0,1,1,1,\"%s\"", right);
          }
          previous_footer = footer;
