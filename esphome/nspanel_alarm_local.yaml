# Local, offline-capable weekly alarm for NSPanel Easy v2026.10.2.
# Time is SNTP-backed instead of solely depending on Home Assistant.
# Once SNTP has synchronized, a running panel keeps time without HA/Wi-Fi.
# If both power and time sync are unavailable after a cold boot, timing is NOT guaranteed.
# Correct timezone MUST match Home Assistant for weekday/date interpretation.

substitutions:
  alarm_timezone: Europe/Berlin

# NSPanel Easy ships time_provider: homeassistant. Switch to SNTP (upstream documented !extend hook).
time:
  - id: !extend time_provider
    platform: sntp
    timezone: ${alarm_timezone}
    servers:
      - !secret local_ntp_server
      - 0.pool.ntp.org
      - 1.pool.ntp.org

# All scheduling data is saved across software restarts. ESPHome manages flash writes.
esphome:
  includes:
    - nspanel_alarm_schedule_v2.h
    - nspanel_alarm_identity.h
    - nspanel_alarm_controls.h
    - nspanel_alarm_effects_v1.h
    - alarm_display_state.h

preferences:
  # Restored globals poll every second; sync pending writes at the same cadence.
  # Sudden power loss can still lose the most recent state changes.
  flash_write_interval: 1s

globals:
  - {id: wa_tone_preset, type: int, restore_value: yes, initial_value: '0'}
  # A local edit is mirrored to HA helpers before accepting another HA plan.
  - {id: wa_ui_revision, type: uint32_t, restore_value: yes, initial_value: '0'}
  - {id: wa_ui_ack, type: uint32_t, restore_value: yes, initial_value: '0'}
  - {id: wa_ui_edit_hour, type: int, restore_value: yes, initial_value: '0'}
  - {id: wa_ui_edit_minute, type: int, restore_value: yes, initial_value: '0'}
  - {id: wa_ui_edit_enabled, type: bool, restore_value: yes, initial_value: 'false'}
  - id: wa_ui_profile
    type: int
    restore_value: no
    initial_value: '0'
  - id: wa_hour
    type: int
    restore_value: yes
    initial_value: '6'
  - id: wa_minute
    type: int
    restore_value: yes
    initial_value: '30'
  - id: wa_weekmask  # bit0=Monday ... bit6=Sunday
    type: int
    restore_value: yes
    initial_value: '31'
  - id: wa_enabled
    type: bool
    restore_value: yes
    initial_value: 'false'  # Safe first-boot: must be explicitly armed in HA.
  - id: wa_snooze_minutes
    type: int
    restore_value: yes
    initial_value: '9'
  - id: wa_buzzer_grace_s
    type: int
    restore_value: yes
    initial_value: '15'  # Always buzzer after 15s, EVEN IF speaker says "playing".
  - id: wa_last_fired_ymd
    type: int
    restore_value: yes
    initial_value: '0'
  - id: wa_unacknowledged
    type: bool
    restore_value: yes
    initial_value: 'false'
  - id: wa_snooze_epoch
    type: uint32_t
    restore_value: yes
    initial_value: '0'
  - id: wa_ringing
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: wa_ringing_started_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  # Dated exceptions never rewrite the ordinary weekly schedule.
  - {id: wa_plan_date0, type: int, restore_value: yes, initial_value: '0'}
  - {id: wa_plan_epoch0, type: uint32_t, restore_value: yes, initial_value: '0'}
  - {id: wa_plan_source0, type: int, restore_value: yes, initial_value: '0'}
  - {id: wa_plan_date1, type: int, restore_value: yes, initial_value: '0'}
  - {id: wa_plan_epoch1, type: uint32_t, restore_value: yes, initial_value: '0'}
  - {id: wa_plan_source1, type: int, restore_value: yes, initial_value: '0'}

api:
  actions:
    - action: alarm_preview_tone
      variables:
        expected_device: string
        expected_mac: string
        preset: int
      then:
        - lambda: |-
            if (wake_alarm::matches_identity(expected_device, expected_mac, App.get_name(), get_mac_address()))
              id(wa_preview_tone).execute(preset);
    - action: alarm_stop_tone_preview
      variables:
        expected_device: string
        expected_mac: string
      then:
        - lambda: |-
            if (wake_alarm::matches_identity(expected_device, expected_mac, App.get_name(), get_mac_address()))
              id(wa_stop_preview).execute();
    - action: alarm_tone_settings
      variables:
        expected_device: string
        expected_mac: string
        preset: int
      then:
        - lambda: |-
            if (wake_alarm::matches_identity(expected_device, expected_mac, App.get_name(), get_mac_address()) && preset >= 0 && preset <= 3)
              id(wa_tone_preset) = preset;
    - action: alarm_ack_ui
      variables:
        expected_device: string
        expected_mac: string
        revision: int
      then:
        - lambda: |-
            if (wake_alarm::matches_identity(expected_device, expected_mac, App.get_name(), get_mac_address()) &&
                static_cast<uint32_t>(revision) == id(wa_ui_revision)) id(wa_ui_ack) = id(wa_ui_revision);
    - action: alarm_disable
      then:
        - lambda: |-
            if (!wake_alarm::ui_edit_pending(id(wa_ui_profile), id(wa_ui_revision), id(wa_ui_ack)))
              id(wa_enabled) = false;
    - action: alarm_apply_plan
      variables:
        enabled: bool
        hour: int
        minute: int
        weekdays: int
        snooze_minutes: int
        buzzer_grace_seconds: int
        date0: int
        epoch0: int
        source0: int
        date1: int
        epoch1: int
        source1: int
      then:
        - script.execute:
            id: wa_apply_plan
            enabled: !lambda return enabled;
            hour: !lambda return hour;
            minute: !lambda return minute;
            weekdays: !lambda return weekdays;
            snooze_minutes: !lambda return snooze_minutes;
            buzzer_grace_seconds: !lambda return buzzer_grace_seconds;
            date0: !lambda return date0;
            epoch0: !lambda return epoch0;
            source0: !lambda return source0;
            date1: !lambda return date1;
            epoch1: !lambda return epoch1;
            source1: !lambda return source1;
    - action: alarm_apply_device_plan
      variables:
        expected_device: string
        expected_mac: string
        enabled: bool
        hour: int
        minute: int
        weekdays: int
        snooze_minutes: int
        buzzer_grace_seconds: int
        date0: int
        epoch0: int
        source0: int
        date1: int
        epoch1: int
        source1: int
      then:
        - if:
            condition:
              lambda: |-
                return wake_alarm::matches_identity(expected_device, expected_mac, App.get_name(), get_mac_address());
            then:
              - script.execute:
                  id: wa_apply_plan
                  enabled: !lambda return enabled;
                  hour: !lambda return hour;
                  minute: !lambda return minute;
                  weekdays: !lambda return weekdays;
                  snooze_minutes: !lambda return snooze_minutes;
                  buzzer_grace_seconds: !lambda return buzzer_grace_seconds;
                  date0: !lambda return date0;
                  epoch0: !lambda return epoch0;
                  source0: !lambda return source0;
                  date1: !lambda return date1;
                  epoch1: !lambda return epoch1;
                  source1: !lambda return source1;
            else:
              - logger.log:
                  level: ERROR
                  tag: wake_alarm
                  format: "Rejected alarm plan for another device"
    - action: alarm_disable_device
      variables:
        expected_device: string
        expected_mac: string
      then:
        - lambda: |-
            if (wake_alarm::matches_identity(expected_device, expected_mac, App.get_name(), get_mac_address()) &&
                !wake_alarm::ui_edit_pending(id(wa_ui_profile), id(wa_ui_revision), id(wa_ui_ack)))
              id(wa_enabled) = false;
            else ESP_LOGE("wake_alarm", "Rejected disable for another device");
    - action: alarm_configure
      variables:
        enabled: bool
        hour: int
        minute: int
        weekdays: int
        snooze_minutes: int
        buzzer_grace_seconds: int
      then:
        - lambda: |-
            if (wake_alarm::ui_edit_pending(id(wa_ui_profile), id(wa_ui_revision), id(wa_ui_ack))) return;
            // Reject corrupt/malformed configs rather than erasing the last good schedule.
            if (hour < 0 || hour > 23 || minute < 0 || minute > 59 ||
                weekdays < 0 || weekdays > 127 || snooze_minutes < 1 ||
                snooze_minutes > 60 || buzzer_grace_seconds < 0 ||
                buzzer_grace_seconds > 120) {
              ESP_LOGE("wake_alarm", "REJECTED invalid alarm config");
              return;
            }
            id(wa_hour) = hour;
            id(wa_minute) = minute;
            id(wa_weekmask) = weekdays;
            id(wa_snooze_minutes) = snooze_minutes;
            id(wa_buzzer_grace_s) = buzzer_grace_seconds;
            id(wa_enabled) = enabled;
            ESP_LOGI("wake_alarm", "Stored alarm %02d:%02d, mask=%d, enabled=%d",
                     static_cast<int>(hour), static_cast<int>(minute),
                     static_cast<int>(weekdays), enabled);
    - action: alarm_snooze
      then:
        - script.execute: wa_do_snooze
    - action: alarm_stop
      then:
        - script.execute: wa_do_stop
    - action: alarm_test
      then:
        - script.execute: wa_start

select:
  - platform: template
    id: wa_preview_choice
    name: Alarm Clock Preview Tone
    options: [Wake, Classic, Gentle, Signal]
    initial_option: Wake
    optimistic: true
    restore_value: false
script:
  - id: wa_preview_tone
    parameters:
      preset: int
    then:
      - lambda: |-
          if (wake_alarm::tone_preview().begin(preset,millis(),id(wa_unacknowledged),wake_alarm::display_state().busy))
            id(buzzer).play(wake_alarm::alarm_tone(preset));
  - id: wa_stop_preview
    then:
      - lambda: |-
          if (wake_alarm::tone_preview().stop() && !id(wa_unacknowledged)) id(buzzer).stop();
  - id: wa_apply_plan
    parameters:
      enabled: bool
      hour: int
      minute: int
      weekdays: int
      snooze_minutes: int
      buzzer_grace_seconds: int
      date0: int
      epoch0: int
      source0: int
      date1: int
      epoch1: int
      source1: int
    then:
      - lambda: |-
          static_assert(NSPANEL_ALARM_SCHEDULE_API_VERSION == 2,
                        "Outdated alarm header: remove local header copies and clean build files");
          if (wake_alarm::ui_edit_pending(id(wa_ui_profile), id(wa_ui_revision), id(wa_ui_ack))) {
            ESP_LOGW("wake_alarm", "Local edit pending HA acknowledgement; keeping local plan");
            return;
          }
          if (hour < 0 || hour > 23 || minute < 0 || minute > 59 ||
              weekdays < 0 || weekdays > 127 || snooze_minutes < 1 ||
              snooze_minutes > 60 || buzzer_grace_seconds < 0 ||
              buzzer_grace_seconds > 120) return;
          const auto now = id(time_provider).now();
          const wake_alarm::DayPlan first{date0, epoch0, source0};
          const wake_alarm::DayPlan second{date1, epoch1, source1};
          // Clear-all is permitted without a trusted clock. Other changes
          // require complete valid slots and a bounded near-term horizon.
          const bool clear = date0 == 0 && epoch0 == 0 && source0 == 0 &&
                             date1 == 0 && epoch1 == 0 && source1 == 0;
          if (!clear && (!now.is_valid() || now.timestamp <= 1735689600 ||
              !wake_alarm::valid_plan(first, now.timestamp) ||
              !wake_alarm::valid_plan(second, now.timestamp) ||
              (date0 != 0 && date0 == date1))) {
            ESP_LOGE("wake_alarm", "Rejected invalid dated alarm plan");
            return;
          }
          id(wa_plan_date0) = date0;
          id(wa_plan_epoch0) = epoch0;
          id(wa_plan_source0) = source0;
          id(wa_plan_date1) = date1;
          id(wa_plan_epoch1) = epoch1;
          id(wa_plan_source1) = source1;
          id(wa_hour) = hour;
          id(wa_minute) = minute;
          id(wa_weekmask) = weekdays;
          id(wa_snooze_minutes) = snooze_minutes;
          id(wa_buzzer_grace_s) = buzzer_grace_seconds;
          id(wa_enabled) = enabled;  // Arm last, after the complete plan.
  - id: wa_start
    mode: single
    then:
      - if:
          condition:
            lambda: 'return !id(wa_ringing);'
          then:
            - lambda: |-
                if (wake_alarm::tone_preview().stop()) id(buzzer).stop();
                id(wa_unacknowledged) = true;
                id(wa_snooze_epoch) = 0;
                id(wa_ringing) = true;
                id(wa_ringing_started_ms) = millis();
                ESP_LOGW("wake_alarm", "Alarm started; buzzer will be mandatory");
            - script.execute: wa_buzzer_loop

  - id: wa_buzzer_loop
    mode: restart
    then:
      - while:
          condition:
            lambda: 'return id(wa_ringing);'
          then:
            - if:
                condition:
                  lambda: |-
                    return (uint32_t)(millis() - id(wa_ringing_started_ms)) >=
                           (uint32_t)(id(wa_buzzer_grace_s) * 1000);
                then:
                  - lambda: |-
                      // buzzer belongs to the unchanged NSPanel Easy hw_buzzer package.
                      id(buzzer).play(wake_alarm::alarm_tone(id(wa_tone_preset)));
                  - delay: 3s
                else:
                  - delay: 1s

  - id: wa_do_snooze
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(wa_unacknowledged);'
          then:
            - lambda: |-
                const auto t = id(time_provider).now();
                if (t.is_valid() && t.timestamp > 1735689600) {
                  id(wa_snooze_epoch) = (uint32_t)t.timestamp + id(wa_snooze_minutes) * 60;
                  id(wa_ringing) = false;
                  ESP_LOGI("wake_alarm", "Snoozed until %lu",
                           static_cast<unsigned long>(id(wa_snooze_epoch)));
                } else {
                  // No trusted clock, do NOT enter an indefinite silent snooze.
                  id(wa_snooze_epoch) = 0;
                  ESP_LOGE("wake_alarm", "Snooze denied: clock invalid; alarm continues");
                }
            - if:
                condition:
                  lambda: 'return !id(wa_ringing);'
                then:
                  - script.stop: wa_buzzer_loop
                  - lambda: 'id(buzzer).stop();'

  - id: wa_do_stop
    mode: restart
    then:
      - lambda: |-
          // Stop only an existing alarm. Do not suppress an unrelated future day.
          id(wa_unacknowledged) = false;
          id(wa_snooze_epoch) = 0;
          id(wa_ringing) = false;
          ESP_LOGI("wake_alarm", "Alarm acknowledged and stopped");
      - script.stop: wa_buzzer_loop
      - lambda: 'id(buzzer).stop();'

  # Clear upstream actions in one extension, then install the alarm handler.
  - id: !extend button_left_press_short
    then: !remove
  - id: !extend button_left_press_short
    then:
      - if:
          condition:
            lambda: 'return id(wa_ringing);'
          then:
            - script.execute: wa_do_snooze

  # Clear upstream actions in one extension, then install the alarm handler.
  - id: !extend button_right_press_short
    then: !remove
  - id: !extend button_right_press_short
    then:
      - if:
          condition:
            lambda: 'return id(wa_unacknowledged);'
          then:
            - script.execute: wa_do_stop

  # Clear upstream actions in one extension, then install the alarm handler.
  - id: !extend button_right_press_long
    then: !remove
  - id: !extend button_right_press_long
    then:
      - if:
          condition:
            lambda: 'return id(wa_unacknowledged);'
          then:
            - script.execute: wa_do_stop

# A short interval + 15 min catchup ensures ordinary restarts around alarm time do not skip.
# Independent of the HA automation/Blueprint loop.
interval:
  - interval: 100ms
    then:
      - lambda: |-
          if (wake_alarm::tone_preview().tick(millis(),id(wa_unacknowledged),wake_alarm::display_state().busy))
            id(buzzer).stop();
  - interval: 5s
    then:
      - lambda: |-
          if (id(wa_unacknowledged)) {
            if (!id(wa_ringing)) {
              const auto now = id(time_provider).now();
              if (!now.is_valid() || now.timestamp <= 1735689600 ||
                  id(wa_snooze_epoch) == 0 ||
                  (uint32_t)now.timestamp >= id(wa_snooze_epoch)) {
                wa_start->execute();
              }
            }
            return;
          }
          if (!id(wa_enabled) || id(wa_ringing)) return;
          const auto now = id(time_provider).now();
          if (!now.is_valid() || now.timestamp <= 1735689600) return;

          const int ymd = wake_alarm::due_date((time_t)now.timestamp,
              id(wa_hour), id(wa_minute), id(wa_weekmask), id(wa_last_fired_ymd),
              {{{id(wa_plan_date0), id(wa_plan_epoch0), id(wa_plan_source0)},
                {id(wa_plan_date1), id(wa_plan_epoch1), id(wa_plan_source1)}}});
          if (ymd != 0) {
            id(wa_last_fired_ymd) = ymd;
            wa_start->execute();
          }

binary_sensor:
  - platform: template
    name: "Alarm Clock Time Valid"
    id: wake_alarm_time_valid
    lambda: |-
      const auto now = id(time_provider).now();
      return now.is_valid() && now.timestamp > 1735689600;
  - platform: template
    name: "Alarm Clock Ringing"
    id: wake_alarm_ringing
    lambda: 'return id(wa_ringing);'
  - platform: template
    name: "Alarm Clock Pending"
    id: wake_alarm_unacknowledged
    lambda: 'return id(wa_unacknowledged);'

text_sensor:
  - platform: template
    name: "Alarm Clock UI Mode"
    entity_category: diagnostic
    update_interval: 10s
    lambda: |-
      return {id(wa_ui_profile) == 2 ? "standalone_v1" :
              id(wa_ui_profile) == 1 ? "easy_clock_ui_v2" : "core_only_no_clock_ui"};
  # Stable, device-scoped discovery contract; does not depend on entity names.
  - platform: template
    name: "Alarm Clock Device Snapshot"
    entity_category: diagnostic
    update_interval: 10s
    lambda: |-
      char value[256];
      snprintf(value, sizeof(value), "NSPALARM1|%s|%s|%d:%d:%d:%d:%d:%d|%d:%lu:%d:%d:%lu:%d",
          App.get_name().c_str(), get_mac_address().c_str(),
          id(wa_enabled) ? 1 : 0, id(wa_weekmask), id(wa_hour), id(wa_minute),
          id(wa_snooze_minutes), id(wa_buzzer_grace_s),
          id(wa_plan_date0), (unsigned long)id(wa_plan_epoch0), id(wa_plan_source0),
          id(wa_plan_date1), (unsigned long)id(wa_plan_epoch1), id(wa_plan_source1));
      return {value};
  - platform: template
    name: "Alarm Clock Day Plan Signature"
    update_interval: 10s
    lambda: |-
      char value[100];
      snprintf(value, sizeof(value), "%d:%lu:%d:%d:%lu:%d",
          id(wa_plan_date0), (unsigned long)id(wa_plan_epoch0), id(wa_plan_source0),
          id(wa_plan_date1), (unsigned long)id(wa_plan_epoch1), id(wa_plan_source1));
      return {value};
  - platform: template
    name: "Alarm Clock Status"
    update_interval: 5s
    lambda: |-
      if (id(wa_ringing)) return {"ringing"};
      if (id(wa_unacknowledged)) return {"snoozed"};
      const auto t = id(time_provider).now();
      if (!t.is_valid() || t.timestamp <= 1735689600) return {"clock_invalid"};
      if (id(wa_enabled)) return {"armed"};
      return {"disarmed"};

  - platform: template
    name: "Alarm Clock Configuration Signature"
    update_interval: 10s
    lambda: |-
      char signature[48];
      snprintf(signature, sizeof(signature), "%d:%d:%d:%d:%d:%d",
               id(wa_enabled) ? 1 : 0, id(wa_weekmask), id(wa_hour),
               id(wa_minute), id(wa_snooze_minutes), id(wa_buzzer_grace_s));
      return {signature};

button:
  - platform: template
    name: Alarm Clock Preview Selected Tone
    on_press:
      - lambda: |-
          const auto selected=id(wa_preview_choice).active_index();
          if (selected.has_value()) id(wa_preview_tone).execute(selected.value());
  - platform: template
    name: Alarm Clock Preview Configured Tone
    on_press:
      - lambda: id(wa_preview_tone).execute(id(wa_tone_preset));
  - platform: template
    name: Alarm Clock Stop Tone Preview
    on_press:
      - script.execute: wa_stop_preview
  - platform: template
    name: "Alarm Clock Test"
    on_press:
      then:
        - script.execute: wa_start
  - platform: template
    name: "Alarm Clock Snooze"
    on_press:
      then:
        - script.execute: wa_do_snooze
  - platform: template
    name: "Alarm Clock Stop"
    on_press:
      then:
        - script.execute: wa_do_stop

