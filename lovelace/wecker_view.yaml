# Lovelace view fragment; add to an existing YAML-mode dashboard under views:.
# Entity IDs of the panel must be checked after ESPHome pairing.
- title: Alarm Clock
  path: wecker
  icon: mdi:alarm
  cards:
    - type: entities
      title: Configure Alarm Clock
      show_header_toggle: false
      entities:
        - entity: input_boolean.wecker_aktiv
        - entity: input_datetime.wecker_zeit
        - entity: input_select.wecker_ausgabe
        - entity: input_number.wecker_snooze
        - entity: input_number.wecker_summer_verzoegerung
    - type: entities
      title: Weekdays
      show_header_toggle: false
      entities:
        - input_boolean.wecker_mo
        - input_boolean.wecker_di
        - input_boolean.wecker_mi
        - input_boolean.wecker_do
        - input_boolean.wecker_fr
        - input_boolean.wecker_sa
        - input_boolean.wecker_so
    - type: entities
      title: Speaker & Media
      show_header_toggle: false
      entities:
        - input_text.wecker_player
        - input_text.wecker_medien_id
        - input_text.wecker_medien_typ
        - input_number.wecker_start_lautstaerke
        - input_number.wecker_ziel_lautstaerke
    - type: entities
      title: Status & Diagnostics
      show_header_toggle: false
      entities:
        - binary_sensor.alarm_clock_schedule_synchronized
        - sensor.alarm_clock_expected_configuration_signature
        - sensor.nspanel_schlafzimmer_alarm_clock_configuration_signature
        - sensor.nspanel_schlafzimmer_alarm_clock_status
        - binary_sensor.nspanel_schlafzimmer_alarm_clock_ringing
        - binary_sensor.nspanel_schlafzimmer_alarm_clock_pending
    - type: horizontal-stack
      cards:
        - type: button
          name: Test
          icon: mdi:alarm-light
          tap_action:
            action: call-service
            service: script.wecker_test
        - type: button
          name: Snooze
          icon: mdi:sleep
          tap_action:
            action: call-service
            service: script.wecker_schlummern
        - type: button
          name: Stop
          icon: mdi:alarm-off
          tap_action:
            action: call-service
            service: script.wecker_stop
