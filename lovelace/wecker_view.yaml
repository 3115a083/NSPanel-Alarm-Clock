# Lovelace view fragment; add to an existing YAML-mode dashboard under views:.
# Entity IDs of the panel must be checked after ESPHome pairing.
- title: Wecker
  path: wecker
  icon: mdi:alarm
  cards:
    - type: entities
      title: Wecker konfigurieren
      show_header_toggle: false
      entities:
        - entity: input_boolean.wecker_aktiv
        - entity: input_datetime.wecker_zeit
        - entity: input_select.wecker_ausgabe
        - entity: input_number.wecker_snooze
        - entity: input_number.wecker_summer_verzoegerung
    - type: entities
      title: Wochentage
      show_header_toggle: false
      entities:
        - input_boolean.wecker_mo
        - input_boolean.wecker_di
        - input_boolean.wecker_mi
        - input_boolean.wecker_do
        - input_boolean.wecker_fr
        - input_boolean.wecker_sa
        - input_boolean.wecker_so
    - type: entities
      title: Lautsprecher & Medien
      show_header_toggle: false
      entities:
        - input_text.wecker_player
        - input_text.wecker_medien_id
        - input_text.wecker_medien_typ
        - input_number.wecker_start_lautstaerke
        - input_number.wecker_ziel_lautstaerke
    - type: entities
      title: Status & Diagnose
      show_header_toggle: false
      entities:
        - binary_sensor.wecker_plan_synchronisiert
        - sensor.wecker_erwartete_konfigurationssignatur
        - sensor.nspanel_schlafzimmer_wecker_konfiguration_signatur
        - sensor.nspanel_schlafzimmer_wecker_status
        - binary_sensor.nspanel_schlafzimmer_wecker_klingelt
        - binary_sensor.nspanel_schlafzimmer_wecker_unbestatigt
    - type: horizontal-stack
      cards:
        - type: button
          name: Test
          icon: mdi:alarm-light
          tap_action:
            action: call-service
            service: script.wecker_test
        - type: button
          name: Schlummern
          icon: mdi:sleep
          tap_action:
            action: call-service
            service: script.wecker_schlummern
        - type: button
          name: Stoppen
          icon: mdi:alarm-off
          tap_action:
            action: call-service
            service: script.wecker_stop
