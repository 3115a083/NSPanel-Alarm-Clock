blueprint:
  name: NSPanel Alarm Clock | Setup and Controls
  description: >-
    Configure the local NSPanel alarm. Priority per date: valid app alarm,
    calendar wake time inside the selected range, regular weekly alarm.
    Dated exceptions cover today and tomorrow and are stored on the panel.
    Standalone firmware needs only this automation; the local display boots without HA.
    Easy-addon firmware still needs its Easy base automation.
    Disable the old wecker_schedule_sync automation to avoid competing writers.
    Requires firmware with the NSPALARM1 device snapshot and device-bound actions.
    Helpers can be created in the UI or from alarm_clock_helpers.yaml.
    Includes local clock/screensaver settings and optional display-only data pages.
    Direct changes to device brightness/sleep controls select local ownership;
    turn on Display Settings from Blueprint on the device to resume these settings.
    Thermostat/humidifier controls and local relay rules require explicit opt-in. Custom button actions can control explicitly configured other targets. It never uploads firmware/TFT and does not create helpers.
  domain: automation
  source_url: https://github.com/3115a083/NSPanel-Alarm-Clock/blob/main/homeassistant/blueprints/nspanel_alarm_device.yaml
  homeassistant:
    min_version: 2026.10.1
  input:
    panel:
      name: 1. Device and source-helper mapping
      description: Select the panel once. Source helpers are mapped here; their on/off state enables app/calendar wake sources.
      input:
        panel_device:
          name: NSPanel device
          description: Select this panel once. Names and signatures are discovered on this device.
          selector:
            device:
              filter: {integration: esphome}
        app_enabled_helper:
          name: Enable app alarm import helper
          description: Required mapping for compatibility. Leave the corresponding enable helper off when that source is unused.
          selector: {entity: {filter: {domain: input_boolean}}}
        app_time_helper:
          name: Imported alarm helper (date AND time)
          description: Required mapping for compatibility. Leave the corresponding enable helper off when that source is unused.
          selector: {entity: {filter: {domain: input_datetime}}}
        calendar_enabled_helper:
          name: Enable calendar alarms helper
          description: Required mapping for compatibility. Leave the corresponding enable helper off when that source is unused.
          selector: {entity: {filter: {domain: input_boolean}}}
    regular:
      name: 2. Weekly alarm and master switch
      description: "Priority per date: imported app alarm, eligible calendar appointment, weekly fallback. Off master prevents all future schedules."
      input:
        enabled_helper:
          name: Allow scheduled alarms - master switch helper
          description: Off prevents future weekly, app and calendar alarms. It does not acknowledge an alarm already ringing.
          selector: {entity: {filter: {domain: input_boolean}}}
        time_helper:
          name: Weekly fallback time - time-only helper
          description: Touch Save updates this helper. App or calendar dates remain separate.
          selector: {entity: {filter: {domain: input_datetime}}}
        weekdays:
          name: Regular alarm weekdays
          description: Leave empty to use only app/calendar alarms.
          default: [mon, tue, wed, thu, fri]
          selector:
            select:
              multiple: true
              options:
                - {label: Monday, value: mon}
                - {label: Tuesday, value: tue}
                - {label: Wednesday, value: wed}
                - {label: Thursday, value: thu}
                - {label: Friday, value: fri}
                - {label: Saturday, value: sat}
                - {label: Sunday, value: sun}
        snooze_minutes:
          name: Snooze minutes
          default: 9
          selector: {number: {min: 1, max: 60, step: 1, mode: box}}
        buzzer_grace:
          name: Internal buzzer delay after alarm starts (seconds)
          description: Use 0 for immediate buzzer. Remote audio never disables it.
          default: 15
          selector: {number: {min: 0, max: 120, step: 1, mode: box}}
    display:
      name: 3. Display pages and appliance control
      description: Selected sources enable pages automatically. Open Pages by tapping the top title; arrows/swipes skip the alarm editor. Appliance control remains a separate opt-in.
      collapsed: true
      input:
        clock_format:
          name: Time format
          default: '24h'
          selector: {select: {options: ['24h', '12h']}}
        awake_brightness:
          name: Awake brightness (%)
          default: 25
          selector: {number: {min: 1, max: 100, step: 1, mode: box}}
        weather_entities:
          name: Weather page (zero or one)
          default: []
          selector: {entity: {filter: {domain: weather}, multiple: true}}
        display_entities:
          name: Read-only entity page (up to four)
          default: []
          selector: {entity: {filter: [{domain: sensor}, {domain: binary_sensor}, {domain: light}, {domain: switch}], multiple: true}}
        climate_entities:
          name: Thermostat page (zero or one)
          default: []
          selector: {entity: {filter: {domain: climate}, multiple: true}}
        climate_control:
          name: Allow explicit thermostat controls on the panel
          default: false
          selector: {boolean: {}}
        humidifier_entities:
          name: Humidifier page (zero or one)
          default: []
          selector: {entity: {filter: {domain: humidifier}, multiple: true}}
        humidifier_control:
          name: Allow explicit humidifier controls on the panel
          default: false
          selector: {boolean: {}}
    agenda:
      name: 4. Calendar display after waking
      description: These calendars only populate the display. They do not alter wake times; wake calendars are in section 7.
      collapsed: true
      input:
        agenda_calendars:
          name: Display calendars (independent of alarm calendars)
          default: []
          selector: {entity: {filter: {domain: calendar}, multiple: true}}
        agenda_filter:
          name: Agenda title contains (optional, case insensitive)
          default: ''
          selector: {text: {}}
        agenda_after_stop:
          name: Show calendar page after Stop (seconds; 0 = off)
          default: 0
          description: Snooze does not count as getting up. Select Display calendars first.
          selector: {number: {min: 0, max: 3600, step: 1, mode: box}}
    night:
      name: 5. Screensaver and lights-out schedule
      description: Dim retains the clock; 0% backlight is unreadable in a dark room. Inactivity applies inside the selected window or all day. Lights-out overrides dimming.
      collapsed: true
      input:
        night_mode:
          name: Screensaver
          description: Dim keeps the clock and next alarm visible. Black turns the backlight off.
          default: dim
          selector: {select: {options: [dim, black, disabled]}}
        night_timeout:
          name: Inactivity before screensaver (seconds, 0 disables)
          default: 30
          selector: {number: {min: 0, max: 86400, step: 1, mode: box}}
        night_brightness:
          name: Dim clock brightness (%)
          default: 1
          selector: {number: {min: 0, max: 100, step: 1, mode: box}}
        schedule_enabled:
          name: Limit screensaver to a time window (off = all day)
          default: false
          selector: {boolean: {}}
        schedule_start:
          name: Screensaver window starts
          default: '22:00:00'
          selector: {time: {}}
        schedule_end:
          name: Screensaver window ends
          description: Overnight supported. Equal start/end means all day. Inactivity still applies.
          default: '07:00:00'
          selector: {time: {}}
        blackout_enabled:
          name: Enable a separate backlight-off window
          default: false
          selector: {boolean: {}}
        blackout_start:
          name: Backlight-off window starts
          default: '23:00:00'
          selector: {time: {}}
        blackout_end:
          name: Backlight-off window ends
          default: '06:00:00'
          selector: {time: {}}
        blackout_lights:
          name: Turn backlight off only if this light is off (zero or one)
          description: Empty means unconditional inside the backlight-off window. Unknown/stale light never enables blackout. Touch wakes temporarily; ringing always wakes.
          default: []
          selector: {entity: {filter: {domain: light}, multiple: true}}
        prewake_minutes:
          name: Wake the display this many minutes before the alarm (0 disables)
          default: 0
          selector: {number: {min: 0, max: 60, step: 1, mode: box}}
    app:
      name: 6. Optional app alarm import
      description: Only active when the mapped App Import helper is on. Android sensor is optional; an authenticated integration can set the date-and-time helper instead.
      collapsed: true
      input:
        app_entities:
          name: Android next alarm sensor (zero or one)
          description: >-
            Select one Companion next_alarm sensor, filtered to your alarm app.
            Or leave empty and let an authenticated app/integration update the
            date-and-time helper. Choose how missing sensor values are handled.
          default: []
          selector: {entity: {filter: {domain: sensor, device_class: timestamp}, multiple: true}}
        app_package:
          name: Required Android Package attribute (optional)
          description: Copy the desired sensor Package attribute exactly. Blank accepts any package.
          default: ""
          selector: {text: {}}
        app_missing_policy:
          name: Missing app alarm value
          description: >-
            Android can clear next_alarm at alarm time or lose connectivity.
            Keeping the already committed alarm prevents losing it. To cancel
            it deliberately, switch App Import off. Clear mode instead falls
            back to calendar/regular as soon as the sensor becomes invalid.
          default: keep_committed
          selector:
            select:
              options:
                - {label: Keep an already committed app alarm, value: keep_committed}
                - {label: Clear app alarm and use fallback, value: clear}
    calendar:
      name: 7. Optional calendar wake adjustment
      description: "Only active when the mapped Calendar Alarm helper is on. Example: appointment 08:00 minus 30 min gives 07:30. A late appointment outside the allowed range uses weekly fallback."
      collapsed: true
      input:
        calendars:
          name: Calendars to inspect
          default: []
          selector: {entity: {filter: {domain: calendar}, multiple: true}}
        lead_minutes:
          name: Minutes before appointment
          default: 30
          selector: {number: {min: 0, max: 240, step: 1, mode: box}}
        earliest:
          name: Earliest allowed calendar wake time
          default: "06:00:00"
          selector: {time: {}}
        latest:
          name: Latest allowed calendar wake time
          description: >-
            Inclusive, same-day range. Outside it the regular alarm applies.
            Example latest 08:30, lead 30: an 08:00 event wakes at 07:30,
            a 10:00 event is ignored. All-day events are ignored.
          default: "08:30:00"
          selector: {time: {}}
        calendar_mode:
          name: Calendar priority
          default: in_range
          selector:
            select:
              options:
                - {label: Use calendar wake time inside range, value: in_range}
                - {label: Only move the regular alarm earlier, value: earlier_only}
        calendar_free_days:
          name: Allow calendar alarms on unselected weekdays
          default: false
          selector: {boolean: {}}
    tones:
      name: 8. Alarm tone and harmless preview
      description: Use Preview Selected/Configured Tone and Stop Tone Preview on the ESPHome device. Preview lasts at most 5 s, changes no alarm time and triggers no relay. Test Alarm is a real alarm and CAN trigger enabled relays.
      collapsed: true
      input:
        alarm_tone:
          name: Mandatory local alarm tone
          default: wake
          selector: {select: {options: [wake, classic, gentle, signal]}}
        preview_request_helpers:
          name: Optional tone-preview button helper (zero or one)
          description: Press this input_button to hear the selected alarm tone for at most 5 seconds. This is NOT Test Alarm and never triggers relays. Without a helper, use Preview Selected/Configured Tone on the panel device.
          default: []
          selector: {entity: {filter: {domain: input_button}, multiple: true}}
    buttons:
      name: 9. Physical buttons - normal operation
      description: Short acts on release, hold at 0.8 s. Right hold for 5 s always stops an alarm. Decrease/increase only work in editor or appliance screens; use Previous/Next for direct page navigation.
      collapsed: true
      input:
        normal_left_short:
          name: Normal - left short
          default: minus
          selector:
            select:
              options:
                - {label: "No action", value: none}
                - {label: "Snooze (ringing alarm only)", value: snooze}
                - {label: "Stop pending alarm", value: stop}
                - {label: "Previous page", value: previous}
                - {label: "Next page", value: next}
                - {label: "Open alarm-time editor", value: editor}
                - {label: "Decrease selected editor/appliance value", value: minus}
                - {label: "Increase selected editor/appliance value", value: plus}
                - {label: "Run custom Home Assistant action", value: custom}
        normal_right_short:
          name: Normal - right short
          default: plus
          selector:
            select:
              options:
                - {label: "No action", value: none}
                - {label: "Snooze (ringing alarm only)", value: snooze}
                - {label: "Stop pending alarm", value: stop}
                - {label: "Previous page", value: previous}
                - {label: "Next page", value: next}
                - {label: "Open alarm-time editor", value: editor}
                - {label: "Decrease selected editor/appliance value", value: minus}
                - {label: "Increase selected editor/appliance value", value: plus}
                - {label: "Run custom Home Assistant action", value: custom}
        normal_left_long:
          name: Normal - left long
          default: previous
          selector:
            select:
              options:
                - {label: "No action", value: none}
                - {label: "Snooze (ringing alarm only)", value: snooze}
                - {label: "Stop pending alarm", value: stop}
                - {label: "Previous page", value: previous}
                - {label: "Next page", value: next}
                - {label: "Open alarm-time editor", value: editor}
                - {label: "Decrease selected editor/appliance value", value: minus}
                - {label: "Increase selected editor/appliance value", value: plus}
                - {label: "Run custom Home Assistant action", value: custom}
        normal_right_long:
          name: Normal - right long
          default: next
          selector:
            select:
              options:
                - {label: "No action", value: none}
                - {label: "Snooze (ringing alarm only)", value: snooze}
                - {label: "Stop pending alarm", value: stop}
                - {label: "Previous page", value: previous}
                - {label: "Next page", value: next}
                - {label: "Open alarm-time editor", value: editor}
                - {label: "Decrease selected editor/appliance value", value: minus}
                - {label: "Increase selected editor/appliance value", value: plus}
                - {label: "Run custom Home Assistant action", value: custom}
        show_button_labels:
          name: Show physical-button labels at the bottom of the display
          description: Left/right labels sit directly above the physical buttons. S means short press, H means hold. They follow normal/alarm mappings and disappear in night mode. None means no action in the current screen.
          default: true
          selector: {boolean: {}}
    alarm_buttons:
      name: 10. Physical buttons - pending alarm or Snooze
      description: The alarm owns the display. Choose Snooze, Stop, no action or an explicit custom action. Page/editor choices previously ignored in this state are no longer offered.
      collapsed: true
      input:
        alarm_left_short:
          name: Alarm - left short
          default: snooze
          selector:
            select:
              options:
                - {label: "No action", value: none}
                - {label: "Snooze (ringing alarm only)", value: snooze}
                - {label: "Stop pending alarm", value: stop}
                - {label: "Run custom Home Assistant action", value: custom}
        alarm_right_short:
          name: Alarm - right short
          default: stop
          selector:
            select:
              options:
                - {label: "No action", value: none}
                - {label: "Snooze (ringing alarm only)", value: snooze}
                - {label: "Stop pending alarm", value: stop}
                - {label: "Run custom Home Assistant action", value: custom}
        alarm_left_long:
          name: Alarm - left long
          default: snooze
          selector:
            select:
              options:
                - {label: "No action", value: none}
                - {label: "Snooze (ringing alarm only)", value: snooze}
                - {label: "Stop pending alarm", value: stop}
                - {label: "Run custom Home Assistant action", value: custom}
        alarm_right_long:
          name: Alarm - right long
          default: stop
          selector:
            select:
              options:
                - {label: "No action", value: none}
                - {label: "Snooze (ringing alarm only)", value: snooze}
                - {label: "Stop pending alarm", value: stop}
                - {label: "Run custom Home Assistant action", value: custom}
    custom_buttons:
      name: 11. Custom button actions and on-screen names
      description: Each sequence is shared by normal/alarm mappings that select Custom for that gesture. Delegate long sequences to HA scripts because this setup automation uses restart mode.
      collapsed: true
      input:
        custom_left_short:
          name: Custom HA action - left short
          description: Runs only when the corresponding normal/alarm mapping is custom.
          default: []
          selector: {action: {}}
        custom_right_short:
          name: Custom HA action - right short
          description: Runs only when the corresponding normal/alarm mapping is custom.
          default: []
          selector: {action: {}}
        custom_left_long:
          name: Custom HA action - left long
          description: Runs only when the corresponding normal/alarm mapping is custom.
          default: []
          selector: {action: {}}
        custom_right_long:
          name: Custom HA action - right long
          description: Runs only when the corresponding normal/alarm mapping is custom.
          default: []
          selector: {action: {}}
        label_left_short:
          name: Display name for custom left short action
          description: Optional short name, up to 8 visible ASCII characters. Used when this gesture is assigned Custom, in either operating state.
          default: Custom
          selector: {text: {}}
        label_right_short:
          name: Display name for custom right short action
          description: Optional short name, up to 8 visible ASCII characters. Used when this gesture is assigned Custom, in either operating state.
          default: Custom
          selector: {text: {}}
        label_left_long:
          name: Display name for custom left long action
          description: Optional short name, up to 8 visible ASCII characters. Used when this gesture is assigned Custom, in either operating state.
          default: Custom
          selector: {text: {}}
        label_right_long:
          name: Display name for custom right long action
          description: Optional short name, up to 8 visible ASCII characters. Used when this gesture is assigned Custom, in either operating state.
          default: Custom
          selector: {text: {}}
    outputs:
      name: 12. Relay 1 - optional local alarm output
      description: Off by default. Test Alarm triggers enabled rules too. Pulse uses Duration from switch-on; run-on uses Duration from Stop. Maximum automatic on-time always wins. Manual override cancels owned timers.
      collapsed: true
      input:
        relay1_mode:
          name: Relay 1 - alarm behavior
          default: 'off'
          selector:
            select:
              options:
                - {label: "Disabled", value: "off"}
                - {label: "Pulse, then switch off", value: "pulse"}
                - {label: "On until Stop", value: "until_stop"}
                - {label: "Keep on after Stop (maximum time still applies)", value: "latch"}
                - {label: "On during alarm, then run on after Stop", value: "after_stop"}
        relay1_delay:
          name: Relay 1 - delay before switching on (seconds)
          default: 0
          selector: {number: {min: 0, max: 600, step: 1, mode: box}}
        relay1_duration:
          name: Relay 1 - pulse duration or after-Stop duration (seconds)
          default: 2
          selector: {number: {min: 1, max: 3600, step: 1, mode: box}}
        relay1_max_on:
          name: Relay 1 - maximum automatic on time (seconds)
          description: Applies to every mode, including latch. Auxiliary buzzer is additionally capped at 60 seconds. Manual operation has no alarm timer.
          default: 3600
          selector: {number: {min: 1, max: 86400, step: 1, mode: box}}
        relay1_buzzer:
          name: Relay 1 - connected load is an auxiliary buzzer
          default: false
          selector: {boolean: {}}
        relay1_snooze_off:
          name: Relay 1 - switch off on Snooze
          default: true
          selector: {boolean: {}}
        relay1_resume:
          name: Relay 1 - trigger again when Snooze ends
          default: true
          selector: {boolean: {}}
        relay1_conditions:
          name: Relay 1 - optional on/off conditions (up to four)
          description: Evaluated at alarm start and before a delayed switch-on. Unknown/unavailable/stale denies a new switch-on. Empty means no HA condition.
          default: []
          selector: {entity: {filter: [{domain: binary_sensor}, {domain: input_boolean}, {domain: light}, {domain: switch}], multiple: true}}
        relay1_condition_mode:
          name: Relay 1 - combine conditions
          default: all
          selector:
            select:
              options:
                - {label: 'AND: every selected condition is on', value: all}
                - {label: 'OR: at least one selected condition is on', value: any}
    relay2:
      name: 13. Relay 2 - optional local alarm output
      description: Same independent rules as Relay 1. Empty conditions allow local offline operation; unknown or stale selected conditions block a new switch-on.
      collapsed: true
      input:
        relay2_mode:
          name: Relay 2 - alarm behavior
          default: 'off'
          selector:
            select:
              options:
                - {label: "Disabled", value: "off"}
                - {label: "Pulse, then switch off", value: "pulse"}
                - {label: "On until Stop", value: "until_stop"}
                - {label: "Keep on after Stop (maximum time still applies)", value: "latch"}
                - {label: "On during alarm, then run on after Stop", value: "after_stop"}
        relay2_delay:
          name: Relay 2 - delay before switching on (seconds)
          default: 0
          selector: {number: {min: 0, max: 600, step: 1, mode: box}}
        relay2_duration:
          name: Relay 2 - pulse duration or after-Stop duration (seconds)
          default: 2
          selector: {number: {min: 1, max: 3600, step: 1, mode: box}}
        relay2_max_on:
          name: Relay 2 - maximum automatic on time (seconds)
          description: Applies to every mode, including latch. Auxiliary buzzer is additionally capped at 60 seconds. Manual operation has no alarm timer.
          default: 3600
          selector: {number: {min: 1, max: 86400, step: 1, mode: box}}
        relay2_buzzer:
          name: Relay 2 - connected load is an auxiliary buzzer
          default: false
          selector: {boolean: {}}
        relay2_snooze_off:
          name: Relay 2 - switch off on Snooze
          default: true
          selector: {boolean: {}}
        relay2_resume:
          name: Relay 2 - trigger again when Snooze ends
          default: true
          selector: {boolean: {}}
        relay2_conditions:
          name: Relay 2 - optional on/off conditions (up to four)
          description: Evaluated at alarm start and before a delayed switch-on. Unknown/unavailable/stale denies a new switch-on. Empty means no HA condition.
          default: []
          selector: {entity: {filter: [{domain: binary_sensor}, {domain: input_boolean}, {domain: light}, {domain: switch}], multiple: true}}
        relay2_condition_mode:
          name: Relay 2 - combine conditions
          default: all
          selector:
            select:
              options:
                - {label: 'AND: every selected condition is on', value: all}
                - {label: 'OR: at least one selected condition is on', value: any}

mode: restart
max_exceeded: silent
variables:
  preview_request_helpers: !input preview_request_helpers
  show_button_labels: !input show_button_labels
  label_left_short: !input label_left_short
  label_right_short: !input label_right_short
  label_left_long: !input label_left_long
  label_right_long: !input label_right_long
  alarm_tone: !input alarm_tone
  relay1_mode: !input relay1_mode
  relay1_delay: !input relay1_delay
  relay1_duration: !input relay1_duration
  relay1_max_on: !input relay1_max_on
  relay1_buzzer: !input relay1_buzzer
  relay1_snooze_off: !input relay1_snooze_off
  relay1_resume: !input relay1_resume
  relay1_conditions: !input relay1_conditions
  relay1_condition_mode: !input relay1_condition_mode
  relay2_mode: !input relay2_mode
  relay2_delay: !input relay2_delay
  relay2_duration: !input relay2_duration
  relay2_max_on: !input relay2_max_on
  relay2_buzzer: !input relay2_buzzer
  relay2_snooze_off: !input relay2_snooze_off
  relay2_resume: !input relay2_resume
  relay2_conditions: !input relay2_conditions
  relay2_condition_mode: !input relay2_condition_mode
  schedule_enabled: !input schedule_enabled
  schedule_start: !input schedule_start
  schedule_end: !input schedule_end
  blackout_enabled: !input blackout_enabled
  blackout_start: !input blackout_start
  blackout_end: !input blackout_end
  blackout_lights: !input blackout_lights
  normal_left_short: !input normal_left_short
  normal_right_short: !input normal_right_short
  normal_left_long: !input normal_left_long
  normal_right_long: !input normal_right_long
  alarm_left_short: !input alarm_left_short
  alarm_right_short: !input alarm_right_short
  alarm_left_long: !input alarm_left_long
  alarm_right_long: !input alarm_right_long
  panel_device: !input panel_device
  clock_format: !input clock_format
  night_mode: !input night_mode
  night_timeout: !input night_timeout
  night_brightness: !input night_brightness
  awake_brightness: !input awake_brightness
  prewake_minutes: !input prewake_minutes
  weather_entities: !input weather_entities
  display_entities: !input display_entities
  climate_entities: !input climate_entities
  climate_control: !input climate_control
  humidifier_entities: !input humidifier_entities
  humidifier_control: !input humidifier_control
  agenda_calendars: !input agenda_calendars
  agenda_filter: !input agenda_filter
  agenda_after_stop: !input agenda_after_stop
  enabled_helper: !input enabled_helper
  time_helper: !input time_helper
  weekdays: !input weekdays
  snooze_minutes: !input snooze_minutes
  buzzer_grace: !input buzzer_grace
  app_enabled_helper: !input app_enabled_helper
  app_time_helper: !input app_time_helper
  app_entities: !input app_entities
  app_package: !input app_package
  app_missing_policy: !input app_missing_policy
  calendar_enabled_helper: !input calendar_enabled_helper
  calendars: !input calendars
  lead_minutes: !input lead_minutes
  earliest: !input earliest
  latest: !input latest
  calendar_mode: !input calendar_mode
  calendar_free_days: !input calendar_free_days
triggers:
  - trigger: state
    id: tone_preview
    entity_id: !input preview_request_helpers
  - trigger: template
    id: panel_available
    value_template: >-
      {% set ns=namespace(ready=false) %}
      {% for entity in device_entities(panel_device) %}
        {% if entity in integration_entities('esphome') and states(entity).startswith('NSPALARM1|') %}{% set ns.ready=true %}{% endif %}
      {% endfor %}
      {{ ns.ready }}
  - trigger: state
    entity_id: !input relay1_conditions
  - trigger: state
    entity_id: !input relay2_conditions
  - trigger: state
    entity_id: !input blackout_lights
  - trigger: event
    id: panel_ui
    event_type: esphome.nspanel_alarm
    event_data:
      device_id: !input panel_device
  - trigger: homeassistant
    event: start
  - trigger: event
    event_type: automation_reloaded
  - trigger: time_pattern
    minutes: /5
  - trigger: state
    entity_id:
      - !input enabled_helper
      - !input time_helper
      - !input app_enabled_helper
      - !input app_time_helper
      - !input calendar_enabled_helper
  - trigger: state
    entity_id: !input app_entities
  - trigger: state
    entity_id: !input calendars
  - trigger: state
    entity_id: !input weather_entities
    for: {seconds: 5}
  - trigger: state
    entity_id: !input display_entities
    for: {seconds: 5}
  - trigger: state
    entity_id: !input climate_entities
    for: {seconds: 5}
  - trigger: state
    entity_id: !input humidifier_entities
    for: {seconds: 5}
  - trigger: state
    entity_id: !input agenda_calendars
actions:
  - variables:
      snapshots: >-
        {% set ns = namespace(items=[]) %}
        {% for entity in device_entities(panel_device) %}
          {% if entity in integration_entities('esphome') and
                states(entity).startswith('NSPALARM1|') %}
            {% set ns.items = ns.items + [entity] %}
          {% endif %}
        {% endfor %}
        {{ ns.items }}
  - if: "{{ snapshots | length != 1 }}"
    then:
      - stop: Selected device must expose exactly one current Alarm Clock Device Snapshot. Update firmware or enable its diagnostic entity.
        error: true
  - variables:
      snapshot_entity: "{{ snapshots[0] }}"
      snapshot: "{{ states(snapshots[0]).split('|') }}"
      registered_macs: >-
        {% set ns = namespace(items=[]) %}
        {% for connection in device_attr(panel_device, 'connections') or [] %}
          {% if connection[0] == 'mac' %}
            {% set ns.items = ns.items + [connection[1] | replace(':','') | replace('-','') | lower] %}
          {% endif %}
        {% endfor %}
        {{ ns.items }}
  - if: >-
      {{ snapshot | length != 5 or device_id(snapshot_entity) != panel_device or
         not (snapshot[1] | regex_match('^[a-z][a-z0-9_-]{0,62}$')) or
         not (snapshot[2] | regex_match('^[0-9a-fA-F]{12}$')) or
         snapshot[2] | lower not in registered_macs or
         not (snapshot[3] | regex_match('^[0-9]+(:[0-9]+){5}$')) or
         not (snapshot[4] | regex_match('^[0-9]+(:[0-9]+){5}$')) }}
    then:
      - stop: Alarm Clock identity is incompatible or does not match the selected device. No alarm action sent.
        error: true
  - variables:
      panel_name: "{{ snapshot[1] }}"
      config_value: "{{ snapshot[3] }}"
      plan_value: "{{ snapshot[4] }}"
      master: "{{ is_state(enabled_helper, 'on') }}"
      calendar_on: "{{ is_state(calendar_enabled_helper, 'on') }}"
      app_on: "{{ is_state(app_enabled_helper, 'on') }}"
      weekmask: >-
        {% set ns = namespace(mask=0) %}
        {% for day in ['mon','tue','wed','thu','fri','sat','sun'] %}
          {% if day in weekdays %}{% set ns.mask = ns.mask + 2 ** loop.index0 %}{% endif %}
        {% endfor %}
        {{ ns.mask }}
  - if: "{{ trigger is defined and trigger.id | default('') == 'tone_preview' }}"
    then:
      - condition: template
        value_template: >-
          {{ preview_request_helpers | length == 1 and trigger.to_state is defined and trigger.to_state is not none and
             trigger.to_state.entity_id == preview_request_helpers[0] and
             (trigger.from_state is none or trigger.from_state.state != trigger.to_state.state) and
             as_timestamp(trigger.to_state.state,0) > as_timestamp(now()) - 5 and
             as_timestamp(trigger.to_state.state,0) <= as_timestamp(now()) + 1 }}
      - variables:
          preview_action: "{{ 'esphome.' ~ panel_name | replace('-','_') ~ '_alarm_preview_tone' }}"
      - condition: template
        value_template: "{{ has_service('esphome',preview_action.split('.')[1]) }}"
      - action: "{{ preview_action }}"
        data:
          expected_device: "{{ snapshot[1] }}"
          expected_mac: "{{ snapshot[2] }}"
          preset: "{{ ['wake','classic','gentle','signal'].index(alarm_tone) }}"
      - stop: Tone preview requested. No schedule, relay or display settings changed.
  - variables:
      report_action: "{{ 'esphome.' ~ panel_name | replace('-','_') ~ '_alarm_report_blueprint' }}"
  - if: "{{ has_service('esphome',report_action.split('.')[1]) }}"
    then:
      - action: "{{ report_action }}"
        continue_on_error: true
        data:
          expected_device: "{{ snapshot[1] }}"
          expected_mac: "{{ snapshot[2] }}"
          version: '0.3.4'
  - variables:
      pages_action: "{{ 'esphome.' ~ panel_name | replace('-','_') ~ '_alarm_page_settings' }}"
      labels_action: "{{ 'esphome.' ~ panel_name | replace('-','_') ~ '_alarm_button_labels' }}"
      requested_page_mask: "{{ 3 + (4 if weather_entities else 0) + (8 if display_entities else 0) + (16 if climate_entities else 0) + (32 if humidifier_entities else 0) + (64 if agenda_calendars else 0) }}"
  - if: "{{ has_service('esphome',pages_action.split('.')[1]) }}"
    then:
      - action: "{{ pages_action }}"
        continue_on_error: true
        data:
          expected_device: "{{ snapshot[1] }}"
          expected_mac: "{{ snapshot[2] }}"
          page_mask: "{{ requested_page_mask }}"
  - if: "{{ has_service('esphome',labels_action.split('.')[1]) }}"
    then:
      - action: "{{ labels_action }}"
        continue_on_error: true
        data:
          expected_device: "{{ snapshot[1] }}"
          expected_mac: "{{ snapshot[2] }}"
          visible: "{{ show_button_labels }}"
          left_short: "{{ label_left_short }}"
          right_short: "{{ label_right_short }}"
          left_long: "{{ label_left_long }}"
          right_long: "{{ label_right_long }}"
  - if: >-
      {{ blackout_lights | length > 1 or weather_entities | length > 1 or display_entities | length > 4 or
         climate_entities | length > 1 or humidifier_entities | length > 1 }}
    then:
      - stop: Select at most one weather/thermostat/humidifier and four display entities.
        error: true
  - variables:
      ui_states: >-
        {% set ns = namespace(items=[]) %}
        {% for entity in device_entities(panel_device) %}
          {% if entity in integration_entities('esphome') and states(entity).startswith('NSPUI1|') %}
            {% set ns.items = ns.items + [states(entity).split('|')] %}
          {% endif %}
        {% endfor %}
        {{ ns.items }}
  - if: "{{ ui_states | length > 1 }}"
    then:
      - stop: Duplicate local UI edit state on this device.
        error: true
  - if: "{{ ui_states | length == 1 }}"
    then:
      - variables:
          ui: "{{ ui_states[0] }}"
      - if: >-
          {{ ui | length != 7 or ui[1] != snapshot[2] or
             not (ui[2] | regex_match('^[0-9]+$')) or not (ui[3] | regex_match('^[0-9]+$')) or
             not (ui[4] | regex_match('^[0-9]+$')) or not (ui[5] | regex_match('^[0-9]+$')) or
             ui[4] | int > 23 or ui[5] | int > 59 or ui[6] not in ['0','1'] }}
        then:
          - stop: Invalid or foreign local edit state. No helper or device write.
            error: true
      - if: "{{ ui[2] != ui[3] }}"
        then:
          - if: >-
              {{ state_attr(time_helper, 'has_time') != true or state_attr(time_helper, 'has_date') != false or
                 states(enabled_helper) not in ['on','off'] }}
            then:
              - stop: Local edit needs valid time-only and master helpers before acknowledgement.
                error: true
          - if: "{{ state_attr(time_helper,'hour') | int(-1) != ui[4] | int or state_attr(time_helper,'minute') | int(-1) != ui[5] | int }}"
            then:
              - action: input_datetime.set_datetime
                target: {entity_id: !input time_helper}
                data:
                  time: "{{ '%02d:%02d:00' | format(ui[4] | int, ui[5] | int) }}"
          - if: "{{ is_state(enabled_helper, 'on') != (ui[6] == '1') }}"
            then:
              - action: "{{ 'input_boolean.turn_on' if ui[6] == '1' else 'input_boolean.turn_off' }}"
                target: {entity_id: !input enabled_helper}
          - variables:
              ack_action: "{{ 'esphome.' ~ panel_name | replace('-','_') ~ '_alarm_ack_ui' }}"
          - if: "{{ not has_service('esphome', ack_action.split('.')[1]) }}"
            then:
              - stop: UI acknowledgement API missing; local edit remains active.
                error: true
          - action: "{{ ack_action }}"
            data:
              expected_device: "{{ snapshot[1] }}"
              expected_mac: "{{ snapshot[2] }}"
              revision: "{{ ui[2] | int }}"
  - if: "{{ trigger is defined and trigger.id | default('') == 'panel_ui' }}"
    then:
      - condition: template
        value_template: >-
          {{ trigger.event.data.device_name | default('') == snapshot[1] and
             trigger.event.data.mac | default('') == snapshot[2] }}
      - variables:
          request: "{{ trigger.event.data.command | default('') }}"
      - choose:
          - conditions: "{{ request == 'button_left_short' }}"
            sequence: !input custom_left_short
          - conditions: "{{ request == 'button_right_short' }}"
            sequence: !input custom_right_short
          - conditions: "{{ request == 'button_left_long' }}"
            sequence: !input custom_left_long
          - conditions: "{{ request == 'button_right_long' }}"
            sequence: !input custom_right_long
          - conditions: "{{ request in ['climate_up','climate_down','climate_toggle'] and climate_control and climate_entities | length == 1 and states(climate_entities[0]) not in ['unknown','unavailable'] }}"
            sequence:
              - variables:
                  target_entity: "{{ climate_entities[0] }}"
              - if: "{{ request == 'climate_toggle' }}"
                then:
                  - action: "{{ 'climate.turn_on' if is_state(target_entity,'off') else 'climate.turn_off' }}"
                    target: {entity_id: "{{ target_entity }}"}
                else:
                  - condition: template
                    value_template: "{{ state_attr(target_entity,'temperature') is number and state_attr(target_entity,'min_temp') is number and state_attr(target_entity,'max_temp') is number }}"
                  - action: climate.set_temperature
                    target: {entity_id: "{{ target_entity }}"}
                    data:
                      temperature: >-
                        {% set step = state_attr(target_entity,'target_temp_step') | float(0.5) %}
                        {% set value = state_attr(target_entity,'temperature') + (step if request == 'climate_up' else -step) %}
                        {{ [[value, state_attr(target_entity,'min_temp')] | max, state_attr(target_entity,'max_temp')] | min }}
          - conditions: "{{ request in ['humidity_up','humidity_down','humidity_toggle'] and humidifier_control and humidifier_entities | length == 1 and states(humidifier_entities[0]) not in ['unknown','unavailable'] }}"
            sequence:
              - variables:
                  target_entity: "{{ humidifier_entities[0] }}"
              - if: "{{ request == 'humidity_toggle' }}"
                then:
                  - action: "{{ 'humidifier.turn_off' if is_state(target_entity,'on') else 'humidifier.turn_on' }}"
                    target: {entity_id: "{{ target_entity }}"}
                else:
                  - condition: template
                    value_template: "{{ state_attr(target_entity,'humidity') is number and state_attr(target_entity,'min_humidity') is number and state_attr(target_entity,'max_humidity') is number }}"
                  - action: humidifier.set_humidity
                    target: {entity_id: "{{ target_entity }}"}
                    data:
                      humidity: >-
                        {% set value = state_attr(target_entity,'humidity') + (5 if request == 'humidity_up' else -5) %}
                        {{ [[value, state_attr(target_entity,'min_humidity')] | max, state_attr(target_entity,'max_humidity')] | min | int }}
      - if: "{{ request != 'schedule_changed' }}"
        then:
          - stop: Explicit panel request handled or ignored. Values refresh from authoritative HA state.
  - variables:
      tone_action: "{{ 'esphome.' ~ panel_name | replace('-','_') ~ '_alarm_tone_settings' }}"
      relay_action: "{{ 'esphome.' ~ panel_name | replace('-','_') ~ '_alarm_relay_settings' }}"
  - if: "{{ has_service('esphome', tone_action.split('.')[1]) }}"
    then:
      - action: "{{ tone_action }}"
        data:
          expected_device: "{{ snapshot[1] }}"
          expected_mac: "{{ snapshot[2] }}"
          preset: "{{ ['wake','classic','gentle','signal'].index(alarm_tone) }}"
  - if: "{{ relay1_conditions | length > 4 }}"
    then:
      - stop: Select at most four relay conditions.
        error: true
  - if: "{{ has_service('esphome', relay_action.split('.')[1]) }}"
    then:
      - variables:
          relay_gate: >-
            {% set ns = namespace(valid=true,on=0) %}
            {% for entity in relay1_conditions %}
              {% if states(entity) not in ['on','off'] %}{% set ns.valid=false %}{% endif %}
              {% if is_state(entity,'on') %}{% set ns.on=ns.on+1 %}{% endif %}
            {% endfor %}
            {{ {'valid':ns.valid,'allowed':ns.valid and (not relay1_conditions or (ns.on == relay1_conditions | length if relay1_condition_mode == 'all' else ns.on > 0))} }}
      - action: "{{ relay_action }}"
        data:
          expected_device: "{{ snapshot[1] }}"
          expected_mac: "{{ snapshot[2] }}"
          relay: 1
          mode: "{{ ['off','pulse','until_stop','latch','after_stop'].index(relay1_mode) }}"
          delay_s: "{{ relay1_delay | int }}"
          duration_s: "{{ relay1_duration | int }}"
          max_on_s: "{{ relay1_max_on | int }}"
          off_on_snooze: "{{ relay1_snooze_off }}"
          retrigger: "{{ relay1_resume }}"
          require_gate: "{{ relay1_conditions | length > 0 }}"
          auxiliary_buzzer: "{{ relay1_buzzer }}"
          gate_allowed: "{{ relay_gate.allowed }}"
          gate_valid: "{{ relay_gate.valid }}"
  - if: "{{ relay2_conditions | length > 4 }}"
    then:
      - stop: Select at most four relay conditions.
        error: true
  - if: "{{ has_service('esphome', relay_action.split('.')[1]) }}"
    then:
      - variables:
          relay_gate: >-
            {% set ns = namespace(valid=true,on=0) %}
            {% for entity in relay2_conditions %}
              {% if states(entity) not in ['on','off'] %}{% set ns.valid=false %}{% endif %}
              {% if is_state(entity,'on') %}{% set ns.on=ns.on+1 %}{% endif %}
            {% endfor %}
            {{ {'valid':ns.valid,'allowed':ns.valid and (not relay2_conditions or (ns.on == relay2_conditions | length if relay2_condition_mode == 'all' else ns.on > 0))} }}
      - action: "{{ relay_action }}"
        data:
          expected_device: "{{ snapshot[1] }}"
          expected_mac: "{{ snapshot[2] }}"
          relay: 2
          mode: "{{ ['off','pulse','until_stop','latch','after_stop'].index(relay2_mode) }}"
          delay_s: "{{ relay2_delay | int }}"
          duration_s: "{{ relay2_duration | int }}"
          max_on_s: "{{ relay2_max_on | int }}"
          off_on_snooze: "{{ relay2_snooze_off }}"
          retrigger: "{{ relay2_resume }}"
          require_gate: "{{ relay2_conditions | length > 0 }}"
          auxiliary_buzzer: "{{ relay2_buzzer }}"
          gate_allowed: "{{ relay_gate.allowed }}"
          gate_valid: "{{ relay_gate.valid }}"
  - variables:
      night_action: "{{ 'esphome.' ~ panel_name | replace('-','_') ~ '_alarm_night_schedule' }}"
  - if: "{{ has_service('esphome', night_action.split('.')[1]) }}"
    then:
      - action: "{{ night_action }}"
        data:
          expected_device: "{{ snapshot[1] }}"
          expected_mac: "{{ snapshot[2] }}"
          schedule_enabled: "{{ schedule_enabled }}"
          blackout_enabled: "{{ blackout_enabled }}"
          blackout_light: "{{ blackout_lights | length == 1 }}"
          light_off: "{{ blackout_lights | length == 1 and is_state(blackout_lights[0], 'off') }}"
          light_valid: "{{ blackout_lights | length == 1 and states(blackout_lights[0]) in ['on','off'] }}"
          schedule_start: "{{ schedule_start.split(':')[0] | int * 60 + schedule_start.split(':')[1] | int }}"
          schedule_end: "{{ schedule_end.split(':')[0] | int * 60 + schedule_end.split(':')[1] | int }}"
          blackout_start: "{{ blackout_start.split(':')[0] | int * 60 + blackout_start.split(':')[1] | int }}"
          blackout_end: "{{ blackout_end.split(':')[0] | int * 60 + blackout_end.split(':')[1] | int }}"
  - variables:
      button_action: "{{ 'esphome.' ~ panel_name | replace('-','_') ~ '_alarm_button_settings' }}"
  - if: "{{ has_service('esphome', button_action.split('.')[1]) }}"
    then:
      - action: "{{ button_action }}"
        data:
          expected_device: "{{ snapshot[1] }}"
          expected_mac: "{{ snapshot[2] }}"
          normal_left_short: "{{ ['none','snooze','stop','previous','next','editor','minus','plus','custom'].index(normal_left_short) }}"
          normal_right_short: "{{ ['none','snooze','stop','previous','next','editor','minus','plus','custom'].index(normal_right_short) }}"
          normal_left_long: "{{ ['none','snooze','stop','previous','next','editor','minus','plus','custom'].index(normal_left_long) }}"
          normal_right_long: "{{ ['none','snooze','stop','previous','next','editor','minus','plus','custom'].index(normal_right_long) }}"
          alarm_left_short: "{{ ['none','snooze','stop','previous','next','editor','minus','plus','custom'].index(alarm_left_short) }}"
          alarm_right_short: "{{ ['none','snooze','stop','previous','next','editor','minus','plus','custom'].index(alarm_right_short) }}"
          alarm_left_long: "{{ ['none','snooze','stop','previous','next','editor','minus','plus','custom'].index(alarm_left_long) }}"
          alarm_right_long: "{{ ['none','snooze','stop','previous','next','editor','minus','plus','custom'].index(alarm_right_long) }}"
  - variables:
      display_action: "{{ 'esphome.' ~ panel_name | replace('-','_') ~ '_alarm_display_settings' }}"
      cards_action: "{{ 'esphome.' ~ panel_name | replace('-','_') ~ '_alarm_update_cards' }}"
  - if: "{{ has_service('esphome', display_action.split('.')[1]) }}"
    then:
      - action: "{{ display_action }}"
        data:
          expected_device: "{{ snapshot[1] }}"
          expected_mac: "{{ snapshot[2] }}"
          twelve_hour: "{{ clock_format == '12h' }}"
          night_mode: "{{ 1 if night_mode == 'dim' else 2 if night_mode == 'black' else 0 }}"
          timeout_seconds: "{{ night_timeout | int }}"
          night_brightness: "{{ night_brightness | int }}"
          awake_brightness: "{{ awake_brightness | int }}"
          prewake_minutes: "{{ prewake_minutes | int }}"
          agenda_seconds: "{{ agenda_after_stop | int }}"
  - if: "{{ has_service('esphome', cards_action.split('.')[1]) }}"
    then:
      - variables:
          agenda_reply: {}
      - if: "{{ agenda_calendars | length > 0 }}"
        then:
          - action: calendar.get_events
            continue_on_error: true
            target: {entity_id: !input agenda_calendars}
            data:
              start_date_time: "{{ now().isoformat() }}"
              end_date_time: "{{ (today_at('00:00') + timedelta(days=2)).isoformat() }}"
            response_variable: agenda_reply
      - variables:
          agenda_valid: >-
            {% set ns = namespace(ok=true) %}
            {% for entity in agenda_calendars %}
              {% if entity not in agenda_reply or agenda_reply[entity].get('events') is not iterable %}{% set ns.ok=false %}{% endif %}
            {% endfor %}
            {{ ns.ok }}
          agenda_lines: >-
            {% set ns = namespace(items=[]) %}
            {% for entity in agenda_calendars %}
              {% for event in agenda_reply.get(entity,{}).get('events',[]) %}
                {% set title = event.get('summary','') | string %}
                {% set raw = event.get('start','') | string %}
                {% set epoch = as_timestamp(raw,0) %}
                {% if epoch > 0 and (not agenda_filter or agenda_filter | lower in title | lower) %}
                  {% set clock = epoch | timestamp_custom('%H:%M' if clock_format == '24h' else '%I:%M %p', true) if ':' in raw else 'All day' %}
                  {% set ns.items = ns.items + [{'epoch':epoch,'text':clock ~ ' ' ~ title}] %}
                {% endif %}
              {% endfor %}
            {% endfor %}
            {{ (ns.items | sort(attribute='epoch') | map(attribute='text') | list)[:2] }}
      - action: "{{ cards_action }}"
        data:
          expected_device: "{{ snapshot[1] }}"
          expected_mac: "{{ snapshot[2] }}"
          page_mask: "{{ 3 + (4 if weather_entities else 0) + (8 if display_entities else 0) + (16 if climate_entities else 0) + (32 if humidifier_entities else 0) + (64 if agenda_calendars else 0) }}"
          weather: "{{ states(weather_entities[0]) if weather_entities else '' }}"
          weather_detail: "{{ (state_attr(weather_entities[0],'temperature') | string) ~ ' ' ~ (state_attr(weather_entities[0],'temperature_unit') | default('',true) | replace('°','')) ~ '  Humidity ' ~ (state_attr(weather_entities[0],'humidity') | string) ~ '%' if weather_entities else '' }}"
          entity0: "{{ ((state_attr(display_entities[0],'friendly_name') | default(display_entities[0],true)) ~ ': ' ~ states(display_entities[0]) ~ ' ' ~ (state_attr(display_entities[0],'unit_of_measurement') | default('',true))) if display_entities | length > 0 else '' }}"
          entity1: "{{ ((state_attr(display_entities[1],'friendly_name') | default(display_entities[1],true)) ~ ': ' ~ states(display_entities[1]) ~ ' ' ~ (state_attr(display_entities[1],'unit_of_measurement') | default('',true))) if display_entities | length > 1 else '' }}"
          entity2: "{{ ((state_attr(display_entities[2],'friendly_name') | default(display_entities[2],true)) ~ ': ' ~ states(display_entities[2]) ~ ' ' ~ (state_attr(display_entities[2],'unit_of_measurement') | default('',true))) if display_entities | length > 2 else '' }}"
          entity3: "{{ ((state_attr(display_entities[3],'friendly_name') | default(display_entities[3],true)) ~ ': ' ~ states(display_entities[3]) ~ ' ' ~ (state_attr(display_entities[3],'unit_of_measurement') | default('',true))) if display_entities | length > 3 else '' }}"
          climate: "{{ states(climate_entities[0]) ~ '  Current ' ~ (state_attr(climate_entities[0],'current_temperature') | string) if climate_entities else '' }}"
          climate_detail: "{{ 'Target ' ~ (state_attr(climate_entities[0],'temperature') | string) ~ (' | controls enabled' if climate_control else ' | read only') if climate_entities else '' }}"
          humidity: "{{ states(humidifier_entities[0]) ~ '  Current ' ~ (state_attr(humidifier_entities[0],'current_humidity') | string) ~ '%' if humidifier_entities else '' }}"
          humidity_detail: "{{ 'Target ' ~ (state_attr(humidifier_entities[0],'humidity') | string) ~ '%' ~ (' | controls enabled' if humidifier_control else ' | read only') if humidifier_entities else '' }}"
          agenda: "{{ agenda_lines[0] if agenda_lines else 'No matching events' }}"
          agenda_detail: "{{ agenda_lines[1] if agenda_lines | length > 1 else '' }}"
          agenda_valid: "{{ agenda_valid }}"
  - variables:
      master: "{{ is_state(enabled_helper, 'on') }}"
  - condition: template
    value_template: "{{ panel_name | regex_match('^[a-z][a-z0-9_-]{0,62}$') }}"
  - if: "{{ states(enabled_helper) == 'off' }}"
    then:
      - variables:
          disable_action: "{{ 'esphome.' ~ panel_name | replace('-', '_') ~ '_alarm_disable_device' }}"
      - condition: template
        value_template: "{{ has_service('esphome', disable_action.split('.')[1]) }}"
      - action: "{{ disable_action }}"
        data:
          expected_device: "{{ snapshot[1] }}"
          expected_mac: "{{ snapshot[2] }}"
      - stop: Future alarms disabled. A currently ringing alarm still needs Stop.
  - condition: template
    value_template: >-
      {{ panel_name | regex_match('^[a-z][a-z0-9_-]{0,62}$') and
         states(enabled_helper) in ['on','off'] and
         states(app_enabled_helper) in ['on','off'] and
         states(calendar_enabled_helper) in ['on','off'] and
         state_attr(time_helper, 'has_time') == true and
         state_attr(time_helper, 'has_date') == false and
         state_attr(time_helper, 'hour') is number and
         state_attr(time_helper, 'minute') is number and
         state_attr(app_time_helper, 'has_time') == true and
         state_attr(app_time_helper, 'has_date') == true and
         app_entities | length <= 1 and earliest <= latest }}
  - variables:
      plans_action: "{{ 'esphome.' ~ panel_name | replace('-', '_') ~ '_alarm_apply_device_plan' }}"
      regular_hour: "{{ state_attr(time_helper, 'hour') | int }}"
      regular_minute: "{{ state_attr(time_helper, 'minute') | int }}"
  - condition: template
    value_template: >-
      {{ has_service('esphome', plans_action.split('.')[1]) }}
  - variables:
      expected_config: "{{ [1 if master else 0, weekmask, regular_hour, regular_minute, snooze_minutes | int, buzzer_grace | int] | join(':') }}"
  - variables:
      app_epoch: >-
        {% if app_on and app_entities | length == 1 %}
          {% set entity = app_entities[0] %}
          {% set raw = as_timestamp(states(entity), 0) | int(0)
             if not app_package or state_attr(entity, 'Package') == app_package else 0 %}
          {% set saved = state_attr(app_time_helper, 'timestamp') | int(0) %}
          {% set committed = plan_value.split(':') %}
          {% set known = committed | length == 6 and
             ((committed[1] | int(0) == saved and committed[2] | int(0) == 1) or
              (committed[4] | int(0) == saved and committed[5] | int(0) == 1)) %}
          {{ raw if raw > as_timestamp(now()) - 900 else
             saved if app_missing_policy == 'keep_committed' and known else 0 }}
        {% elif app_on %}
          {{ state_attr(app_time_helper, 'timestamp') | int(0) }}
        {% else %}0{% endif %}
  - if: "{{ app_on and app_entities | length == 1 }}"
    then:
      - variables:
          mirror_epoch: "{{ app_epoch if app_epoch > as_timestamp(now()) - 900 else as_timestamp('2000-01-01T00:00:00+00:00') | int }}"
      - if: "{{ state_attr(app_time_helper, 'timestamp') | int(0) != mirror_epoch }}"
        then:
          - action: input_datetime.set_datetime
            target:
              entity_id: !input app_time_helper
            data:
              timestamp: "{{ mirror_epoch }}"
  - variables:
      calendar_reply: {}
  - if: "{{ master and calendar_on and calendars | length > 0 }}"
    then:
      - action: calendar.get_events
        continue_on_error: true
        target:
          entity_id: !input calendars
        data:
          start_date_time: "{{ today_at('00:00').isoformat() }}"
          end_date_time: "{{ (today_at('00:00') + timedelta(days=2, minutes=lead_minutes | int)).isoformat() }}"
        response_variable: calendar_reply
      - if: >-
          {% set ns = namespace(ok=true) %}
          {% for entity in calendars %}
            {% if entity not in calendar_reply or calendar_reply[entity].get('events') is not iterable %}
              {% set ns.ok = false %}
            {% endif %}
          {% endfor %}
          {{ not ns.ok }}
        then:
          - stop: Calendar query failed. Keeping the last dated panel plan until it expires or a later successful sync.
            error: true
  - variables:
      day_plans: >-
        {% set result = namespace(slots=[]) %}
        {% for offset in [0,1] %}
          {% set day = today_at('00:00') + timedelta(days=offset) %}
          {% set date = day.strftime('%Y%m%d') | int %}
          {% set normal = ['mon','tue','wed','thu','fri','sat','sun'][day.weekday()] in weekdays %}
          {% set chosen = namespace(epoch=0, source=0, calendar=0) %}
          {% if master and app_on and app_epoch > as_timestamp(now()) - 900 and
                (app_epoch | timestamp_custom('%Y%m%d', true)) | int == date %}
            {% set chosen.epoch = app_epoch | int %}
            {% set chosen.source = 1 %}
          {% elif master and calendar_on and (normal or calendar_free_days) %}
            {% for entity in calendars %}
              {% for event in calendar_reply.get(entity, {}).get('events', []) %}
                {% set raw = event.get('start', '') %}
                {% set epoch = as_timestamp(raw, 0) - (lead_minutes | int) * 60 if ':' in raw else 0 %}
                {% if epoch > as_timestamp(now()) - 900 and
                      (epoch | timestamp_custom('%Y%m%d', true)) | int == date %}
                  {% set clock = epoch | timestamp_custom('%H:%M:%S', true) %}
                  {% set earlier = not normal or clock < '%02d:%02d:00' | format(regular_hour, regular_minute) %}
                  {% if earliest <= clock <= latest and
                        (calendar_mode == 'in_range' or earlier) and
                        (chosen.calendar == 0 or epoch < chosen.calendar) %}
                    {% set chosen.calendar = epoch | int %}
                  {% endif %}
                {% endif %}
              {% endfor %}
            {% endfor %}
            {% if chosen.calendar > 0 %}
              {% set chosen.epoch = chosen.calendar %}{% set chosen.source = 2 %}
            {% endif %}
          {% endif %}
          {% set result.slots = result.slots + [[date if chosen.epoch else 0, chosen.epoch, chosen.source]] %}
        {% endfor %}
        {{ result.slots }}
      expected_plans: "{{ (day_plans[0] + day_plans[1]) | join(':') }}"
  - if: "{{ plan_value != expected_plans or config_value != expected_config }}"
    then:
      - action: "{{ plans_action }}"
        data:
          expected_device: "{{ snapshot[1] }}"
          expected_mac: "{{ snapshot[2] }}"
          enabled: "{{ master }}"
          hour: "{{ regular_hour }}"
          minute: "{{ regular_minute }}"
          weekdays: "{{ weekmask }}"
          snooze_minutes: "{{ snooze_minutes | int }}"
          buzzer_grace_seconds: "{{ buzzer_grace | int }}"
          date0: "{{ day_plans[0][0] }}"
          epoch0: "{{ day_plans[0][1] }}"
          source0: "{{ day_plans[0][2] }}"
          date1: "{{ day_plans[1][0] }}"
          epoch1: "{{ day_plans[1][1] }}"
          source1: "{{ day_plans[1][2] }}"
