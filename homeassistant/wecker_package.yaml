# Home Assistant package: add `homeassistant: packages: !include_dir_named packages`
# to configuration.yaml, copy this as /config/packages/wecker_package.yaml.
# IMPORTANT: Replace the entity_ids / ESPHome services once device is paired.
# Configure the intended audio content before selecting "Speaker + buzzer".

input_boolean:
  wecker_aktiv:
    name: Alarm Clock Enabled
    icon: mdi:alarm-check
  wecker_mo: {name: "Alarm Clock Monday", icon: mdi:calendar-week}
  wecker_di: {name: "Alarm Clock Tuesday", icon: mdi:calendar-week}
  wecker_mi: {name: "Alarm Clock Wednesday", icon: mdi:calendar-week}
  wecker_do: {name: "Alarm Clock Thursday", icon: mdi:calendar-week}
  wecker_fr: {name: "Alarm Clock Friday", icon: mdi:calendar-week}
  wecker_sa: {name: "Alarm Clock Saturday", icon: mdi:calendar-week}
  wecker_so: {name: "Alarm Clock Sunday", icon: mdi:calendar-week}

input_datetime:
  wecker_zeit:
    name: Alarm Clock Time
    has_date: false
    has_time: true

input_select:
  wecker_ausgabe:
    name: Alarm Clock Output
    options:
      - Buzzer
      - Speaker + buzzer
    icon: mdi:volume-high

input_number:
  wecker_snooze:
    name: Snooze Duration
    min: 1
    max: 60
    step: 1
    mode: slider
    unit_of_measurement: min
  wecker_summer_verzoegerung:
    name: Buzzer Delay with Speaker Output
    min: 0
    max: 30
    step: 1
    mode: slider
    unit_of_measurement: s
  wecker_start_lautstaerke:
    name: Starting Volume
    min: 0.1
    max: 0.8
    step: 0.05
  wecker_ziel_lautstaerke:
    name: Target Volume
    min: 0.1
    max: 0.8
    step: 0.05

input_text:
  wecker_player:
    name: Target Speaker (media_player.entity_id)
    max: 255
  wecker_medien_id:
    name: Media ID / Media URI
    max: 255
  wecker_medien_typ:
    name: Media Type (integration specific)
    max: 60
  wecker_aktiver_player:
    name: Internal Active Alarm Speaker
    max: 255

# Diagnostic signature: expected schedule config vs what the ESPHome reports.
template:
  - sensor:
      - name: "Alarm Clock Expected Configuration Signature"
        unique_id: wecker_expected_configuration_signature
        state: >-
          {% set ns = namespace(mask=0) %}
          {% for suffix in ['mo', 'di', 'mi', 'do', 'fr', 'sa', 'so'] %}
            {% if is_state('input_boolean.wecker_' ~ suffix, 'on') %}
              {% set ns.mask = ns.mask + 2 ** loop.index0 %}
            {% endif %}
          {% endfor %}
          {{ [1 if is_state('input_boolean.wecker_aktiv', 'on') else 0,
              ns.mask, state_attr('input_datetime.wecker_zeit', 'hour') | int(0),
              state_attr('input_datetime.wecker_zeit', 'minute') | int(0),
              states('input_number.wecker_snooze') | int(9),
              0 if is_state('input_select.wecker_ausgabe', 'Buzzer') else
                states('input_number.wecker_summer_verzoegerung') | int(15)] | join(':') }}
  - binary_sensor:
      - name: "Alarm Clock Schedule Synchronized"
        unique_id: wecker_schedule_synced
        state: >-
          {% set have = states('sensor.nspanel_schlafzimmer_alarm_clock_configuration_signature') %}
          {% set expected = states('sensor.alarm_clock_expected_configuration_signature') %}
          {{ have not in ['unknown','unavailable'] and
             expected not in ['unknown','unavailable'] and
             have == expected }}
        availability: >-
          {{ states('sensor.nspanel_schlafzimmer_alarm_clock_configuration_signature') not in
             ['unknown','unavailable'] }}

script:
  wecker_stop:
    alias: Stop Alarm Clock (HA + NSPanel)
    mode: restart
    sequence:
      - action: esphome.nspanel_schlafzimmer_alarm_stop
        continue_on_error: true
      - action: script.wecker_audio_beenden

  wecker_schlummern:
    alias: Snooze Alarm Clock (HA + NSPanel)
    mode: restart
    sequence:
      # Only confirmed local Snooze stops audio. Invalid-clock Snooze is denied.
      - action: esphome.nspanel_schlafzimmer_alarm_snooze

  wecker_audio_beenden:
    alias: Stop Alarm Clock Audio
    mode: single
    sequence:
      # Cancel pending wait/ramp before stopping the originally selected player.
      - action: script.turn_off
        target:
          entity_id:
            - script.wecker_audio_wiedergabe
            - script.wecker_lautstaerkerampe
      - variables:
          player: "{{ states('input_text.wecker_aktiver_player') | trim }}"
      - if:
          - condition: template
            value_template: >-
              {{ player | regex_match('^media_player[.][a-z0-9_]+$') and
                 states(player) not in ['unknown', 'unavailable'] }}
        then:
          - action: media_player.media_stop
            target:
              entity_id: "{{ player }}"
            continue_on_error: true
      - action: input_text.set_value
        target:
          entity_id: input_text.wecker_aktiver_player
        data:
          value: ""

  wecker_lautstaerkerampe:
    alias: Alarm Clock Volume Ramp
    mode: restart
    fields:
      player:
        required: true
        selector:
          entity:
            domain: media_player
    sequence:
      - condition: template
        value_template: >-
          {{ player | regex_match('^media_player[.][a-z0-9_]+$') and
             states(player) not in ['unknown', 'unavailable'] }}
      - variables:
          start: "{{ states('input_number.wecker_start_lautstaerke') | float(0.25) }}"
          goal: "{{ states('input_number.wecker_ziel_lautstaerke') | float(0.65) }}"
      - repeat:
          count: 8
          sequence:
            - delay: "00:00:30"
            - condition: state
              entity_id: binary_sensor.nspanel_schlafzimmer_alarm_clock_ringing
              state: "on"
            - action: media_player.volume_set
              target:
                entity_id: "{{ player }}"
              data:
                volume_level: "{{ [[start + (goal-start) * repeat.index / 8, 0.1] | max, 0.8] | min | round(2) }}"
              continue_on_error: true

  wecker_audio_wiedergabe:
    alias: Start Alarm Clock Audio
    mode: single
    sequence:
      - condition: state
        entity_id: binary_sensor.nspanel_schlafzimmer_alarm_clock_ringing
        state: "on"
      - condition: state
        entity_id: input_select.wecker_ausgabe
        state: Speaker + buzzer
      - variables:
          player: "{{ states('input_text.wecker_player') | trim }}"
          content: "{{ states('input_text.wecker_medien_id') | trim }}"
          kind: "{{ states('input_text.wecker_medien_typ') | trim }}"
      - choose:
          - conditions:
              - condition: template
                value_template: >-
                  {{ player | regex_match('^media_player[.][a-z0-9_]+$') and
                     states(player) not in ['unknown', 'unavailable'] and
                     content not in ['', 'unknown', 'unavailable'] and
                     kind not in ['', 'unknown', 'unavailable'] }}
            sequence:
              - action: input_text.set_value
                target:
                  entity_id: input_text.wecker_aktiver_player
                data:
                  value: "{{ player }}"
              - action: media_player.volume_set
                target:
                  entity_id: "{{ player }}"
                data:
                  volume_level: "{{ [[states('input_number.wecker_start_lautstaerke') | float(0.25), 0.1] | max, 0.8] | min }}"
                continue_on_error: true
              - condition: state
                entity_id: binary_sensor.nspanel_schlafzimmer_alarm_clock_ringing
                state: "on"
              - action: media_player.play_media
                target:
                  entity_id: "{{ player }}"
                data:
                  media_content_id: "{{ content }}"
                  media_content_type: "{{ kind }}"
                continue_on_error: true
              - wait_template: "{{ is_state(player, 'playing') }}"
                timeout: "00:00:15"
                continue_on_timeout: true
              - condition: state
                entity_id: binary_sensor.nspanel_schlafzimmer_alarm_clock_ringing
                state: "on"
              - choose:
                  - conditions: "{{ wait.completed }}"
                    sequence:
                      - action: script.turn_on
                        target:
                          entity_id: script.wecker_lautstaerkerampe
                        data:
                          variables:
                            player: "{{ player }}"
                default:
                  - action: persistent_notification.create
                    data:
                      notification_id: wecker_audio_problem
                      title: Alarm Clock Speaker Problem
                      message: Playback was not confirmed. The local buzzer remains independently active.
        default:
          - action: persistent_notification.create
            data:
              notification_id: wecker_audio_problem
              title: Check Alarm Clock Audio Configuration
              message: Configure exactly one available speaker, a media ID and a media type.

  wecker_test:
    alias: Alarm Clock Test (actual local buzzer)
    sequence:
      - action: esphome.nspanel_schlafzimmer_alarm_test

automation:
  - id: wecker_schedule_sync
    alias: Alarm Clock | Send Weekly Schedule to NSPanel
    mode: restart
    triggers:
      - trigger: homeassistant
        event: start
      - trigger: time_pattern
        minutes: "/5"
      - trigger: state
        entity_id:
          - input_boolean.wecker_aktiv
          - input_boolean.wecker_mo
          - input_boolean.wecker_di
          - input_boolean.wecker_mi
          - input_boolean.wecker_do
          - input_boolean.wecker_fr
          - input_boolean.wecker_sa
          - input_boolean.wecker_so
          - input_datetime.wecker_zeit
          - input_number.wecker_snooze
          - input_number.wecker_summer_verzoegerung
          - input_select.wecker_ausgabe
    conditions:
      - condition: template
        value_template: >-
          {% set ns = namespace(ready=true) %}
          {% for entity in ['input_boolean.wecker_aktiv',
              'input_boolean.wecker_mo', 'input_boolean.wecker_di',
              'input_boolean.wecker_mi', 'input_boolean.wecker_do',
              'input_boolean.wecker_fr', 'input_boolean.wecker_sa',
              'input_boolean.wecker_so', 'input_datetime.wecker_zeit',
              'input_number.wecker_snooze',
              'input_number.wecker_summer_verzoegerung', 'input_select.wecker_ausgabe'] %}
            {% if states(entity) in ['unknown', 'unavailable'] %}
              {% set ns.ready = false %}
            {% endif %}
          {% endfor %}
          {{ ns.ready and state_attr('input_datetime.wecker_zeit', 'hour') is not none
             and state_attr('input_datetime.wecker_zeit', 'minute') is not none }}
    actions:
      - variables:
          weekmask: >-
            {% set ns = namespace(mask=0) %}
            {% for suffix in ['mo', 'di', 'mi', 'do', 'fr', 'sa', 'so'] %}
              {% if is_state('input_boolean.wecker_' ~ suffix, 'on') %}
                {% set ns.mask = ns.mask + 2 ** loop.index0 %}
              {% endif %}
            {% endfor %}
            {{ ns.mask }}
      - action: esphome.nspanel_schlafzimmer_alarm_configure
        data:
          enabled: "{{ is_state('input_boolean.wecker_aktiv', 'on') }}"
          hour: "{{ state_attr('input_datetime.wecker_zeit', 'hour') | int(6) }}"
          minute: "{{ state_attr('input_datetime.wecker_zeit', 'minute') | int(30) }}"
          weekdays: "{{ weekmask | int(0) }}"
          snooze_minutes: "{{ states('input_number.wecker_snooze') | int(9) }}"
          buzzer_grace_seconds: >-
            {{ 0 if is_state('input_select.wecker_ausgabe', 'Buzzer')
               else states('input_number.wecker_summer_verzoegerung') | int(15) }}

  # The local scheduler is the only authority for scheduled/test/Snooze alarms.
  - id: wecker_audio_start
    alias: Alarm Clock | Audio Follows Local Alarm
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.nspanel_schlafzimmer_alarm_clock_ringing
        to: "on"
      - trigger: homeassistant
        event: start
    conditions:
      - condition: state
        entity_id: binary_sensor.nspanel_schlafzimmer_alarm_clock_ringing
        state: "on"
    actions:
      - action: script.turn_on
        target:
          entity_id: script.wecker_audio_wiedergabe

  - id: wecker_audio_stop_on_local_ack
    alias: Alarm Clock | Stop Audio on Local Snooze or Stop
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.nspanel_schlafzimmer_alarm_clock_ringing
        to: "off"
    actions:
      - action: script.wecker_audio_beenden
